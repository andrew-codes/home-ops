apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - service.yaml
  - deployment.yaml
# Generated ConfigMaps get a content hash in their name, so editing any file rolls the pod.
configMapGenerator:
  - name: remodel-caddyfile
    files:
      - Caddyfile
  - name: remodel-pages
    files:
      - index.html
      - nav.js
      - nav.css
