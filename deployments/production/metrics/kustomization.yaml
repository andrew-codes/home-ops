apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base/metrics
patches:
  # The gaming PC's sensors and FPS (apps/gaming-pc). The job lives in
  # gaming-pc-scrape.yaml so the scrape config stays readable as YAML.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: vmagent
    path: gaming-pc-scrape.yaml
  # The two Pi-holes' metrics, host load and DNS probes (apps/pihole). It appends
  # to the lists the patch above creates, so it must come after it.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: vmagent
    path: pihole-scrape.yaml
