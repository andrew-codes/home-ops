---
# TrueNAS rules. They read the series the host pushes through its Graphite
# reporting exporter (see apps/truenas). VictoriaMetrics stores those as dotted
# names with no labels, for example
# truenas.nas.truenas_disk_temp.<disk>.temp, so every rule that needs the disk
# or interface in its text pulls it out of __name__ with label_replace first.
# The disk label is shortened to the serial number.
#
# The disk temperature series reach VictoriaMetrics about 15 minutes after the
# time they carry: a sample stamped 19:30 lands at 19:45, one every 5 minutes.
# At any moment the newest disk temperature is therefore 15 to 20 minutes old,
# and a default 5 minute lookback never sees it. The disk temperature rules look
# back 30 to 45 minutes to cover the lag.
#
# Pool health, vdev state, SMART results and pool capacity are not usable from
# these metrics: the exporter drops the pool name, so the used, total and
# available series each mix every pool into one series, and it pushes them with
# the same lag. No rule here can see a degraded pool, a failing disk or a full
# pool. See the alerting README for how that gap is covered
# (truenas-health-vmrules.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: truenas
spec:
  groups:
    - name: truenas-availability
      rules:
        # The uptime series is the heartbeat. If it is gone, the host is off,
        # its network is cut, the exporter is disabled or VictoriaMetrics is not
        # ingesting Graphite, and none of the rules below can fire.
        - alert: TrueNASMetricsMissing
          expr: absent({__name__="truenas.nas.system.uptime.uptime"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS is not reporting metrics"
            description: "No TrueNAS series has arrived in VictoriaMetrics for 10 minutes. The NAS may be down or unreachable, its Graphite reporting exporter may be disabled or pointed at the wrong port, or VictoriaMetrics is not accepting Graphite. The NFS shares the cluster uses may be offline, and the other TrueNAS alerts cannot fire."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
    - name: truenas-disks
      rules:
        # These two rules cover the hard disks and SATA SSDs. An NVMe drive runs
        # at 50 to 55 °C normally, so it is left out here (matched by serial
        # against the SMART series) and has its own thresholds in
        # TrueNASNvmeTemperatureHigh and TrueNASNvmeTemperatureCritical.
        - alert: TrueNASDiskTemperatureHigh
          expr: >-
            label_replace(label_replace(
              last_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[30m]),
              "disk", "$1", "__name__", "truenas[.]nas[.]truenas_disk_temp[.](.+)[.]temp"),
              "disk", "$1", "disk", "_serial_lunid_([^_]+)_.*") >= 50
              unless on(disk)
              label_replace(last_over_time(truenas_smart_temperature_celsius{disk=~"nvme.+"}[30m]),
              "disk", "$1", "serial", "(.+)")
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} is running hot"
            description: "Disk {{ $labels.disk }} has been at {{ $value | humanize }}°C or more for 15 minutes (warning threshold 50°C). Check the fans and airflow in the NAS."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
        - alert: TrueNASDiskTemperatureCritical
          expr: >-
            label_replace(label_replace(
              last_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[30m]),
              "disk", "$1", "__name__", "truenas[.]nas[.]truenas_disk_temp[.](.+)[.]temp"),
              "disk", "$1", "disk", "_serial_lunid_([^_]+)_.*") >= 60
              unless on(disk)
              label_replace(last_over_time(truenas_smart_temperature_celsius{disk=~"nvme.+"}[30m]),
              "disk", "$1", "serial", "(.+)")
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} is overheating"
            description: "Disk {{ $labels.disk }} is at {{ $value | humanize }}°C, at or above the 60°C critical threshold, for 5 minutes. Sustained heat shortens drive life and can cause failures."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
        # A disk that reported in the last day and has no sample in the last 45
        # minutes while other disks still do (the newest sample of a healthy disk
        # is 15 to 20 minutes old, see the note at the top): pulled, failed or
        # dropped off the controller. The disks report together, so a pause of the whole push
        # stream (VictoriaMetrics restarting, a network blip) makes every disk go
        # quiet at once. That is not a disk problem, so the rule needs at least
        # one disk with a recent sample; TrueNASDiskTemperatureMetricsMissing and
        # TrueNASMetricsMissing cover the whole-stream case. It resolves by itself
        # a day after the disk was last seen, so a disk removed on purpose stops
        # alerting.
        - alert: TrueNASDiskMissing
          expr: >-
            (
              label_replace(label_replace(
                last_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[1d]),
                "disk", "$1", "__name__", "truenas[.]nas[.]truenas_disk_temp[.](.+)[.]temp"),
                "disk", "$1", "disk", "_serial_lunid_([^_]+)_.*")
              unless on(disk)
              label_replace(label_replace(
                last_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[45m]),
                "disk", "$1", "__name__", "truenas[.]nas[.]truenas_disk_temp[.](.+)[.]temp"),
                "disk", "$1", "disk", "_serial_lunid_([^_]+)_.*")
            )
            and on()
            (count(last_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[45m])) > 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS disk {{ $labels.disk }} stopped reporting"
            description: "Disk {{ $labels.disk }} reported a temperature in the last day but has had no sample for 45 minutes, while the other disks still report (last value {{ $value | humanize }}°C). The disk may have failed or dropped off its controller. Check the pool in the TrueNAS UI."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
        # The whole family gone while the host still reports: the disk metrics
        # collector stopped. The two rules above cannot see that. The window is
        # 45 minutes because the newest sample of a working collector is 15 to 20
        # minutes old (a 5 minute lookback made this alert fire all the time).
        - alert: TrueNASDiskTemperatureMetricsMissing
          expr: >-
            absent_over_time({__name__=~"truenas[.]nas[.]truenas_disk_temp[.].+[.]temp"}[45m])
            unless absent({__name__="truenas.nas.system.uptime.uptime"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS disk temperatures are not being reported"
            description: "TrueNAS is reporting metrics, but no disk temperature series has arrived for 45 minutes, when a working collector is at most 20 minutes behind. The disk temperature alerts cannot fire."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
        - alert: TrueNASDiskStatsMetricsMissing
          expr: >-
            absent({__name__=~"truenas[.]nas[.]truenas_disk_stats[.]busy[.].+[.]busy"})
            unless absent({__name__="truenas.nas.system.uptime.uptime"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS disk activity is not being reported"
            description: "TrueNAS is reporting metrics, but no disk busy, IOPS or throughput series has arrived for 15 minutes. The disk panels on the dashboard are empty."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
    - name: truenas-network
      rules:
        # Physical interfaces only (names starting en or eth). VM taps (macvtap),
        # bridges and the like are left out. An interface that was never up in
        # the last 7 days, such as an unused port, is not alerted on.
        - alert: TrueNASNetworkLinkDown
          expr: >-
            (
              label_replace(
                last_over_time({__name__=~"truenas[.]nas[.]net_carrier[.](en|eth)[a-z0-9]+[.]up"}[5m]),
                "iface", "$1", "__name__", "truenas[.]nas[.]net_carrier[.](.+)[.]up") == 0
            and on(iface)
              label_replace(
                max_over_time({__name__=~"truenas[.]nas[.]net_carrier[.](en|eth)[a-z0-9]+[.]up"}[7d]),
                "iface", "$1", "__name__", "truenas[.]nas[.]net_carrier[.](.+)[.]up") == 1
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS network link {{ $labels.iface }} is down"
            description: "Interface {{ $labels.iface }} on the NAS has had no carrier for 5 minutes, after being up in the last 7 days. Check the cable, the switch port and the NIC."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
