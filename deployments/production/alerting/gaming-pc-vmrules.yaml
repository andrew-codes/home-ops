# Gaming PC thermal rules. They read the series vmagent scrapes from the PC's
# windows_exporter (GPU sensors) and OhmGraphite (CPU temperature), job
# "gaming-pc", see apps/gaming-pc and deployments/production/metrics.
#
# There is deliberately no "PC is down" or "metrics missing" rule. The PC is off
# or asleep most of the day, so its targets are down most of the day, and
# TargetDown in base/vmrules.yaml skips this job for the same reason. These rules
# only see data while the PC is on, and stay quiet otherwise.
#
# The summary is what the phone push shows (see base/alerting/README.md), so it
# names the game when the FPS summary reports one: the thermal question is "what
# was running when it got hot". The `query` template reads the application at
# the moment the alert fires.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: gaming-pc
spec:
  groups:
    - name: gaming-pc-thermals
      rules:
        # NVIDIA rates the RTX 5090 for 90 C. Normal gaming sits at about 80 C,
        # so 85 C for 5 minutes means something has gone wrong (fans, case
        # airflow, dust, a hot room) before the card starts to throttle.
        - alert: GamingPCGpuTemperatureHigh
          expr: max(windows_gpu_temperature_celsius{job="gaming-pc"}) >= 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Gaming PC GPU is at {{ $value | printf "%.0f" }}°C{{ with query "gaming_pc_active_app_info{job=\"gaming-pc\"}" }}{{ range . }} while playing {{ .Labels.app }}{{ end }}{{ end }}'
            description: 'The RTX 5090 has been at 85°C or more for 5 minutes (now {{ $value | printf "%.0f" }}°C). NVIDIA rates it for 90°C. Check the fans, case airflow and dust before it starts to throttle. The temperature, clocks and fan speed over time are on the Gaming PC dashboard.'
            dashboard_url: https://grafana.smith-simms.family/d/gaming-pc/gaming-pc
        - alert: GamingPCGpuTemperatureCritical
          expr: max(windows_gpu_temperature_celsius{job="gaming-pc"}) >= 90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'Gaming PC GPU is at {{ $value | printf "%.0f" }}°C, its rated maximum{{ with query "gaming_pc_active_app_info{job=\"gaming-pc\"}" }}{{ range . }} while playing {{ .Labels.app }}{{ end }}{{ end }}'
            description: 'The RTX 5090 has been at 90°C or more for 2 minutes (now {{ $value | printf "%.0f" }}°C), the maximum NVIDIA rates it for. Stop the game and check the fans and airflow. The connector at the power cable can run hotter than this sensor reads, and no sensor on this card reports it.'
            dashboard_url: https://grafana.smith-simms.family/d/gaming-pc/gaming-pc
        # A card with its fans stopped is hot within minutes. Fan stop at idle is
        # normal, so this needs the GPU to be above 70 C as well. The value is the
        # temperature.
        - alert: GamingPCGpuFanStopped
          expr: >-
            max(windows_gpu_temperature_celsius{job="gaming-pc"}) > 70
            and on ()
            max(windows_gpu_fan_speed_rpm{job="gaming-pc"}) == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: 'Gaming PC GPU fan reads 0 RPM at {{ $value | printf "%.0f" }}°C{{ with query "gaming_pc_active_app_info{job=\"gaming-pc\"}" }}{{ range . }} while playing {{ .Labels.app }}{{ end }}{{ end }}'
            description: 'The RTX 5090 fan has reported 0 RPM for 3 minutes while the GPU is above 70°C (now {{ $value | printf "%.0f" }}°C). Fan stop is only normal when the card is cool. A fan has failed or the reading is wrong; check the card.'
            dashboard_url: https://grafana.smith-simms.family/d/gaming-pc/gaming-pc
        # The Ryzen 9 9950X3D is specified for 95 C (Tjmax) and boosts into the
        # 80s and briefly higher under load, so these are sustained thresholds:
        # a spike is normal, ten minutes at 85 C is not. The value is the hottest
        # CPU temperature sensor OhmGraphite reports (die and CCD sensors).
        - alert: GamingPCCpuTemperatureHigh
          expr: max(ohm_cpu_celsius{job="gaming-pc"}) >= 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Gaming PC CPU is at {{ $value | printf "%.0f" }}°C{{ with query "gaming_pc_active_app_info{job=\"gaming-pc\"}" }}{{ range . }} while playing {{ .Labels.app }}{{ end }}{{ end }}'
            description: 'The Ryzen 9 9950X3D has been at 85°C or more for 10 minutes (now {{ $value | printf "%.0f" }}°C). It is specified for 95°C. Check the cooler, its fan or pump and the case airflow.'
            dashboard_url: https://grafana.smith-simms.family/d/gaming-pc/gaming-pc
        - alert: GamingPCCpuTemperatureCritical
          expr: max(ohm_cpu_celsius{job="gaming-pc"}) >= 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Gaming PC CPU is at {{ $value | printf "%.0f" }}°C{{ with query "gaming_pc_active_app_info{job=\"gaming-pc\"}" }}{{ range . }} while playing {{ .Labels.app }}{{ end }}{{ end }}'
            description: 'The Ryzen 9 9950X3D has been at 90°C or more for 5 minutes (now {{ $value | printf "%.0f" }}°C), 5°C under the 95°C it throttles at. Stop what is running and check the cooler, its fan or pump and the case airflow.'
            dashboard_url: https://grafana.smith-simms.family/d/gaming-pc/gaming-pc
    - name: gaming-pc-drives
      rules:
        # The collector could not read a drive (or run smartctl at all, then
        # the device is "scan"), so none of the rules below can see it.
        - alert: GamingPCNvmeHealthSourceFailing
          expr: last_over_time(nvme_health_collect_ok{job="gaming-pc"}[15m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gaming PC cannot read the SMART log of {{ $labels.device }}"
            description: "smartctl failed for {{ $labels.device }} on the gaming PC for 10 minutes, so its wear and error alerts cannot fire. In an administrator PowerShell run `& \"$env:ProgramFiles\\smartmontools\\bin\\smartctl.exe\" --all /dev/{{ $labels.device }}` and `Get-ScheduledTaskInfo -TaskName Gaming-PC-DriveHealth`, and run `yarn nx deploy gaming-pc` to put it back."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # The drive itself reports a problem: bit 0 spare below threshold, 1
        # temperature over a threshold, 2 media reliability degraded, 3 read
        # only, 4 volatile memory backup failed. The value is the bit field.
        - alert: GamingPCNvmeCriticalWarning
          expr: last_over_time(nvme_smart_critical_warning{job="gaming-pc"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe drive {{ $labels.device }} in the gaming PC reports a critical warning"
            description: "{{ $labels.model }} ({{ $labels.device }}, serial {{ $labels.serial }}) has critical_warning={{ $value }} (bit field: 1 spare capacity below threshold, 2 temperature, 4 reliability degraded, 8 read only, 16 volatile memory backup failed). Back up what is on it now, then run `smartctl --all /dev/{{ $labels.device }}` in an administrator PowerShell."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # Media and data integrity errors only ever grow. A rise over the last
        # day means the drive hit a new one. The oldest sample of the window is
        # the baseline, so the errors a drive already had do not fire the alert
        # for a day after a first deploy (the same expression as PVENVMeMediaErrors).
        - alert: GamingPCNvmeMediaErrors
          expr: >-
            max_over_time(nvme_smart_media_errors{job="gaming-pc"}[15m])
            - min_over_time(nvme_smart_media_errors{job="gaming-pc"}[1d]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVMe drive {{ $labels.device }} in the gaming PC logged new media errors"
            description: "{{ $labels.model }} ({{ $labels.device }}, serial {{ $labels.serial }}) logged {{ $value | humanize }} new media and data integrity errors in the last day. The drive is returning bad data or failing. Back up what is on it and plan to replace it."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # Warning from 80% up to 95% and critical above, so one drive does not
        # push twice. The same thresholds as PVENVMeWear*.
        - alert: GamingPCNvmeWearHigh
          expr: last_over_time(nvme_smart_percentage_used{job="gaming-pc"}[15m]) > 80 <= 95
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NVMe drive {{ $labels.device }} in the gaming PC is {{ $value | humanize }}% worn"
            description: "{{ $labels.model }} ({{ $labels.device }}) has used {{ $value | humanize }}% of its rated endurance. Plan its replacement."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        - alert: GamingPCNvmeWearCritical
          expr: last_over_time(nvme_smart_percentage_used{job="gaming-pc"}[15m]) > 95
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "NVMe drive {{ $labels.device }} in the gaming PC is almost worn out ({{ $value | humanize }}%)"
            description: "{{ $labels.model }} ({{ $labels.device }}) has used {{ $value | humanize }}% of its rated endurance and can fail at any time. Replace it now."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # The drive sets critical_warning bit 0 below the threshold too; this
        # fires earlier, while 10 points of spare capacity are left.
        - alert: GamingPCNvmeSpareLow
          expr: >-
            last_over_time(nvme_smart_available_spare_percent{job="gaming-pc"}[15m])
            <= last_over_time(nvme_smart_available_spare_threshold_percent{job="gaming-pc"}[15m]) + 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "NVMe drive {{ $labels.device }} in the gaming PC is running out of spare capacity"
            description: "{{ $labels.model }} ({{ $labels.device }}) has {{ $value | humanize }}% spare capacity left, within 10 points of the drive's own threshold. The drive is replacing worn out cells. Plan its replacement."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # windows_exporter keeps serving the textfile unchanged when the task
        # stops writing it, so the drive series look current while they are not.
        # Only judged while the PC is up: it is off most of the day.
        - alert: GamingPCDriveHealthStale
          expr: >-
            (time() - last_over_time(gaming_pc_drive_health_timestamp_seconds{job="gaming-pc"}[15m]) > 20 * 60)
            and on(instance) up{job="gaming-pc",exporter="windows"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gaming PC drive health metrics are {{ $value | humanizeDuration }} old"
            description: "The Gaming-PC-DriveHealth task has not refreshed the drive health textfile for {{ $value | humanizeDuration }} while the PC is on, so its array health, volume space, wear, spare and error alerts show old values. In an administrator PowerShell run `Get-ScheduledTaskInfo -TaskName Gaming-PC-DriveHealth`, and run `yarn nx deploy gaming-pc` to put it back."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # The NVMe drives are one AMD RAID array in the BIOS, so Windows reports
        # the array and not the drives, and smartctl cannot read their SMART
        # through the RAID driver. HealthStatus is what Get-PhysicalDisk says:
        # 0 Healthy, 1 Warning, 2 Unhealthy, 3 Unknown. Judged only while the PC
        # is up, so the alert resolves when it shuts down instead of 15 minutes
        # later, and the value is the status.
        - alert: GamingPCArrayDegraded
          expr: >-
            (last_over_time(gaming_pc_array_health_status{job="gaming-pc"}[15m]) == 1
            or last_over_time(gaming_pc_array_health_status{job="gaming-pc"}[15m]) == 3)
            and on(instance) up{job="gaming-pc",exporter="windows"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gaming PC disk array {{ $labels.array }} is not healthy"
            description: 'Windows reports {{ $labels.array }} as {{ if eq ($value | printf "%.0f") "1" }}Warning{{ else }}Unknown{{ end }} (a degraded array, a failing member drive or a rebuild) for 10 minutes. Per-drive SMART is not readable behind the AMD RAID, so this is the early signal there is. Check the array in the BIOS (AMD RAID) or AMD RAIDXpert and back up what is on it. In an administrator PowerShell run `Get-PhysicalDisk | Format-List FriendlyName, HealthStatus, OperationalStatus`.'
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        - alert: GamingPCArrayUnhealthy
          expr: >-
            last_over_time(gaming_pc_array_health_status{job="gaming-pc"}[15m]) == 2
            and on(instance) up{job="gaming-pc",exporter="windows"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Gaming PC disk array {{ $labels.array }} is unhealthy"
            description: "Windows reports {{ $labels.array }} as Unhealthy for 5 minutes: the array has lost data redundancy or failed. Back up what is on it now, then check the array in the BIOS (AMD RAID) or AMD RAIDXpert. In an administrator PowerShell run `Get-PhysicalDisk | Format-List FriendlyName, HealthStatus, OperationalStatus`."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # The task could not ask Windows about its disks or volumes, so the two
        # array rules and the space rules cannot see them.
        - alert: GamingPCArrayHealthSourceFailing
          expr: last_over_time(gaming_pc_array_collect_ok{job="gaming-pc"}[15m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Gaming PC cannot read its disk array health"
            description: "Get-PhysicalDisk or Get-Volume failed on the gaming PC for 10 minutes, so its array health and volume space alerts cannot fire. In an administrator PowerShell run `Get-PhysicalDisk` and `Get-ScheduledTaskInfo -TaskName Gaming-PC-DriveHealth`, and run `yarn nx deploy gaming-pc` to put it back."
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        # Free space as a share of the volume: below 10% warns, below 5% is
        # critical, so one volume does not push twice. The value is the percent
        # free. Only while the PC is up, like the array rules.
        - alert: GamingPCVolumeFreeSpaceLow
          expr: >-
            (last_over_time(gaming_pc_volume_free_bytes{job="gaming-pc"}[15m])
            / last_over_time(gaming_pc_volume_size_bytes{job="gaming-pc"}[15m]) * 100 < 10 >= 5)
            and on(instance) up{job="gaming-pc",exporter="windows"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Gaming PC volume {{ $labels.volume }} ({{ $labels.role }}) has {{ $value | printf "%.1f" }}% free'
            description: 'Volume {{ $labels.volume }} on the gaming PC has had less than 10% free space for 30 minutes (now {{ $value | printf "%.1f" }}%). Uninstall or move games, or clear the shader and download caches.'
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
        - alert: GamingPCVolumeFreeSpaceCritical
          expr: >-
            (last_over_time(gaming_pc_volume_free_bytes{job="gaming-pc"}[15m])
            / last_over_time(gaming_pc_volume_size_bytes{job="gaming-pc"}[15m]) * 100 < 5)
            and on(instance) up{job="gaming-pc",exporter="windows"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: 'Gaming PC volume {{ $labels.volume }} ({{ $labels.role }}) is almost full ({{ $value | printf "%.1f" }}% free)'
            description: 'Volume {{ $labels.volume }} on the gaming PC has had less than 5% free space for 15 minutes (now {{ $value | printf "%.1f" }}%). Windows, game updates and the page file need room: free space now.'
            dashboard_url: https://grafana.smith-simms.family/d/hardware-health/hardware-health
