apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - volumes.yaml
  - service.yaml
  - deployment.yaml
# Generated ConfigMaps get a content hash in their name, so editing either file rolls the pod.
configMapGenerator:
  - name: couch-colors-caddyfile
    files:
      - Caddyfile
  - name: couch-colors-collector
    files:
      - collector/collector.py
