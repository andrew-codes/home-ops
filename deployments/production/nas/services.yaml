---
apiVersion: v1
kind: Endpoints
metadata:
  name: nas-http
  namespace: default
subsets:
  - addresses:
      - ip: 10.5.90.74
    ports:
      - name: http
        port: 80
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nas-http
  namespace: default
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
  sessionAffinity: None
