apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/ps5
images:
  - name: ghcr.io/andrew-codes/ps5-mqtt
    newName: ghcr.io/funkeyflo/ps5-mqtt
    newTag: latest
patches:
  # The FunkeyFlo image has no /app/run-standalone.sh; its entrypoint (/app/ps5-mqtt/run.sh)
  # starts the server directly, so drop the base command/args override.
  - target:
      kind: Deployment
      name: ps5
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/command
      - op: remove
        path: /spec/template/spec/containers/0/args
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: FRONTEND_PORT
          value: "8080"
