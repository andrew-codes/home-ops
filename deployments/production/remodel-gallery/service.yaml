---
# ClusterIP only: the front door reaches this at remodel-gallery:8080.
apiVersion: v1
kind: Service
metadata:
  name: remodel-gallery
  namespace: default
spec:
  selector:
    app: remodel-gallery
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
