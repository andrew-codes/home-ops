apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - helm-source.yaml
  - helm-release.yaml
# The HelmRelease mounts this ConfigMap by name (dashboardsConfigMaps), so it
# cannot carry the content hash suffix. Grafana rescans the dashboard directory
# on its own, so an edited dashboard is picked up without a pod restart.
configMapGenerator:
  - name: grafana-dashboards-custom
    files:
      - dashboards/alert-history.json
      - dashboards/gaming-pc.json
      - dashboards/logs.json
      - dashboards/pbs.json
      - dashboards/truenas.json
generatorOptions:
  disableNameSuffixHash: true
