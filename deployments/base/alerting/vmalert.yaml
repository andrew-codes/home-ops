---
# Rule engine. Evaluates every VMRule in the namespace against VMSingle, sends
# firing alerts to Alertmanager and writes alert state (ALERTS and
# ALERTS_FOR_STATE) back to VMSingle so "for:" timers survive a restart.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vmalert
spec:
  replicaCount: 1
  evaluationInterval: 30s
  selectAllByDefault: true
  disableSelfServiceScrape: true
  datasource:
    url: http://vmsingle-vmsingle.default.svc.cluster.local:8428
  remoteWrite:
    url: http://vmsingle-vmsingle.default.svc.cluster.local:8428
  remoteRead:
    url: http://vmsingle-vmsingle.default.svc.cluster.local:8428
  notifier:
    url: http://vmalertmanager-vmalertmanager.default.svc.cluster.local:9093
  extraArgs:
    # The "source" link of an alert (Grafana Alerting > Alert groups, "See
    # source") is external.url + "/" + external.alert.source. It opens Grafana
    # Explore on the victoriametrics datasource with the rule expression, from
    # one hour before the alert became active. The URL is production's, like the
    # dashboard_url annotations in vmrules.yaml. The datasource is named (not by
    # uid) because the provisioned datasource has a generated uid, and the
    # pane-level name is resolved by Grafana. A query-level datasource object
    # with an unknown uid makes Explore drop the expression.
    external.url: https://grafana.smith-simms.family
    external.alert.source: 'explore?schemaVersion=1&panes={"p":{"datasource":"victoriametrics","queries":[{"refId":"A","expr":{{ .Expr|jsonEscape|queryEscape }}}],"range":{"from":"{{ (.ActiveAt.Add (parseDurationTime "-1h")).UnixMilli }}","to":"now"}}}&orgId=1'
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
