---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: watchdog
spec:
  groups:
    - name: watchdog
      rules:
        # Always fires. Alertmanager forwards it to Healthchecks.io as a
        # heartbeat; when the pings stop, something between vmalert, VMSingle,
        # Alertmanager, the cluster or the network is down. Never pushed to
        # Home Assistant.
        - alert: Watchdog
          expr: vector(1)
          labels:
            severity: none
          annotations:
            summary: Alerting pipeline heartbeat
            description: Always firing. If Healthchecks.io stops receiving it, the monitoring stack or its network path is down.
---
# Every rule below must carry a summary (what is wrong, naming the target) and a
# description (the affected instance, job or service and the measured value).
# The Home Assistant push is built from these, plus an optional dashboard_url.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: scrape-targets
spec:
  groups:
    - name: scrape-targets
      rules:
        # gaming-pc is excluded because the PC is off or asleep for much of the day, so its
        # targets are down on purpose. Its thermal rules only see data while it is on.
        - alert: TargetDown
          expr: up{job!~"kubernetes-nodes|kubernetes-apiservers|gaming-pc"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} is down{{ if $labels.kubernetes_io_hostname }} on node {{ $labels.kubernetes_io_hostname }}{{ end }}"
            description: "Scrape target {{ $labels.instance }} (job {{ $labels.job }}{{ if $labels.kubernetes_io_hostname }}, node {{ $labels.kubernetes_io_hostname }}{{ end }}) has reported up={{ $value }} for 5 minutes. Its metrics are not being collected and the service may be down."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=VictoriaMetrics
        - alert: KubeletDown
          expr: up{job="kubernetes-nodes"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node {{ $labels.kubernetes_io_hostname }} is unreachable"
            description: "The kubelet on node {{ $labels.kubernetes_io_hostname }} (job {{ $labels.job }}) has reported up={{ $value }} for 5 minutes. The node may be down or not ready, and the pods on it may be offline."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
        - alert: KubeletTargetsMissing
          expr: absent(up{job="kubernetes-nodes"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "No kubelets are being scraped (job {{ $labels.job }})"
            description: "vmagent has no scrape target at all for job {{ $labels.job }} (the kubelet metrics of each Kubernetes node, read through the API server) for 10 minutes. One target per node is expected. Node discovery, the API server proxy or vmagent is broken, so a node going down would go unnoticed."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
        - alert: CAdvisorTargetsMissing
          expr: absent(up{job="kubernetes-nodes-cadvisor"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No cAdvisor targets are being scraped (job {{ $labels.job }})"
            description: "vmagent has no scrape target at all for job {{ $labels.job }} (the per-container CPU and memory metrics of each Kubernetes node) for 10 minutes. One target per node is expected. Container metrics are not being collected."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
        - alert: NodeExporterTargetsMissing
          expr: absent(up{job="node-exporter"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No node-exporter targets are being scraped (job {{ $labels.job }})"
            description: "vmagent has no scrape target at all for job {{ $labels.job }} (the host metrics of each Kubernetes node) for 10 minutes. One target per node is expected. The node disk space alerts cannot fire without it."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter
        - alert: KubeStateMetricsTargetsMissing
          expr: absent(up{job="kube-state-metrics"})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No kube-state-metrics targets are being scraped (job {{ $labels.job }})"
            description: "vmagent has no scrape target at all for job {{ $labels.job }} (the Kubernetes object state exporter) for 10 minutes. The crash loop alerts cannot fire without it."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
        - alert: KubeAPIServerDown
          expr: up{job="kubernetes-apiservers"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes API server is unreachable
            description: "The Kubernetes API server ({{ $labels.instance }}, job {{ $labels.job }}) has reported up={{ $value }} for 5 minutes. The cluster cannot be managed and Flux cannot deploy."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: victoriametrics
spec:
  groups:
    - name: victoriametrics
      rules:
        - alert: VictoriaMetricsLowDiskSpace
          expr: vm_free_disk_space_bytes{job="victoria-metrics"} < 10 * 1024 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: VictoriaMetrics storage is running low on space
            description: "VictoriaMetrics ({{ $labels.instance }}) has {{ $value | humanize1024 }}B free on its data volume, below the 10 GiB threshold. At the built-in minimum it stops accepting writes."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=VictoriaMetrics
        - alert: ProcessRestartingTooOften
          expr: changes(process_start_time_seconds{job=~"victoria-metrics|vmagent|vmalert|alertmanager"}[30m]) > 2
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} keeps restarting"
            description: "{{ $labels.job }} ({{ $labels.instance }}) restarted {{ $value }} times in the last 30 minutes. It is crash-looping or being killed."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=VictoriaMetrics
    - name: vmagent
      rules:
        - alert: VMAgentDroppingData
          expr: sum(increase(vmagent_remotewrite_packets_dropped_total[5m])) without (url) > 0
          labels:
            severity: critical
          annotations:
            summary: vmagent is losing metrics
            description: "vmagent ({{ $labels.instance }}) dropped {{ $value }} blocks of samples in the last 5 minutes before they reached VictoriaMetrics. Those metrics are lost; VictoriaMetrics is rejecting or not accepting writes."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
        - alert: VMAgentQueueDroppingData
          expr: sum(increase(vm_persistentqueue_bytes_dropped_total[5m])) without (path) > 0
          labels:
            severity: critical
          annotations:
            summary: vmagent is losing queued metrics
            description: "vmagent ({{ $labels.instance }}) dropped {{ $value | humanize1024 }}B of queued samples in the last 5 minutes because its disk queue is full. Those metrics are lost; VictoriaMetrics has been unreachable or too slow for a long time."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
        - alert: VMAgentRemoteWriteRetries
          expr: sum(rate(vmagent_remotewrite_retries_count_total[5m])) without (url) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: vmagent cannot write to VictoriaMetrics reliably
            description: "vmagent ({{ $labels.instance }}) has been retrying remote writes to VictoriaMetrics for 15 minutes ({{ $value | humanize }} retries/s)."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
        - alert: VMAgentScrapeErrorsHigh
          expr: >-
            sum(increase(vm_promscrape_scrapes_failed_total[10m])) without (job, instance)
            / sum(increase(vm_promscrape_scrapes_total[10m])) without (job, instance) > 0.25
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Many scrapes are failing
            description: "{{ $value | humanizePercentage }} of vmagent scrapes failed over the last 10 minutes. Several targets may be down; see which ones in the TargetDown alerts or the vmagent dashboard."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=vmagent
    - name: alerting-pipeline
      rules:
        - alert: VMAlertRuleErrors
          expr: increase(vmalert_execution_errors_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Alert rules are failing to evaluate
            description: "vmalert ({{ $labels.instance }}) hit {{ $value }} rule evaluation errors in the last 5 minutes, for 10 minutes running. Alerts may not fire."
        - alert: VMAlertSendErrors
          expr: increase(vmalert_alerts_send_errors_total[5m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: vmalert cannot send alerts to Alertmanager
            description: "vmalert ({{ $labels.instance }}) failed to deliver {{ $value }} alerts to Alertmanager ({{ $labels.addr }}) in the last 5 minutes, for 10 minutes running."
        - alert: AlertmanagerNotificationsFailing
          expr: sum(rate(alertmanager_notifications_failed_total[10m])) by (integration) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Alertmanager cannot deliver notifications
            description: "Alertmanager has been failing to deliver {{ $labels.integration }} notifications for 10 minutes ({{ $value | humanize }} failures/s). Check the receiver URLs in the alertmanager-receivers secret and that Home Assistant is reachable."
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kubernetes-storage
spec:
  groups:
    - name: kubernetes-storage
      rules:
        - alert: PersistentVolumeFillingUp
          expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ $labels.persistentvolumeclaim }} is almost full"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} of its space left (node {{ $labels.kubernetes_io_hostname }})."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
        - alert: PersistentVolumeAlmostFull
          expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.03
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Volume {{ $labels.persistentvolumeclaim }} is nearly out of space"
            description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} of its space left (node {{ $labels.kubernetes_io_hostname }}). The workload using it will start failing."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
---
# Node file system selector shared by the rules below: real disks only. Pseudo,
# memory backed, read-only image and network file systems are left out (network
# volumes are covered by the PersistentVolume rules above).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-disk
spec:
  groups:
    - name: node-disk
      rules:
        - alert: NodeFilesystemFillingUp
          expr: >-
            (
              node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              < 0.40
            and
              predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}[6h], 24 * 3600) < 0
            and
              node_filesystem_readonly{job="node-exporter"} == 0
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.mountpoint }} on node {{ $labels.node }} will fill up within a day"
            description: "{{ $labels.mountpoint }} ({{ $labels.device }}, {{ $labels.fstype }}) on node {{ $labels.node }} has {{ $value | humanizePercentage }} of its space left and, at the rate of the last 6 hours, will run out within 24 hours."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter
        - alert: NodeFilesystemSpaceLow
          expr: >-
            (
              node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              < 0.10
            and
              node_filesystem_readonly{job="node-exporter"} == 0
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.mountpoint }} on node {{ $labels.node }} is almost full"
            description: "{{ $labels.mountpoint }} ({{ $labels.device }}, {{ $labels.fstype }}) on node {{ $labels.node }} has only {{ $value | humanizePercentage }} of its space left."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter
        - alert: NodeFilesystemAlmostFull
          expr: >-
            (
              node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|ramfs|overlay|squashfs|erofs|iso9660|fuse.*|nfs.*|cifs|smb.*"}
              < 0.03
            and
              node_filesystem_readonly{job="node-exporter"} == 0
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.mountpoint }} on node {{ $labels.node }} is nearly out of space"
            description: "{{ $labels.mountpoint }} ({{ $labels.device }}, {{ $labels.fstype }}) on node {{ $labels.node }} has only {{ $value | humanizePercentage }} of its space left. Pods on the node will start failing and the kubelet will evict them."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: kubernetes-workloads
spec:
  groups:
    - name: kubernetes-workloads
      rules:
        # The value is the container's lifetime restart count, taken from the
        # series that is also in CrashLoopBackOff.
        - alert: KubePodCrashLooping
          expr: >-
            kube_pod_container_status_restarts_total{job="kube-state-metrics"}
            and on (namespace, pod, container)
            (max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics",reason="CrashLoopBackOff"}[5m]) >= 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been in CrashLoopBackOff for 10 minutes and has restarted {{ $value }} times in total. It starts, crashes and is restarted with a growing delay."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
        # Catches loops that exit too fast or too slowly to be seen in
        # CrashLoopBackOff on a scrape, and containers killed for running out of memory.
        - alert: KubePodRestartingTooOften
          expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[1h]) > 5
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} keeps restarting"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in the last hour."
            dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
