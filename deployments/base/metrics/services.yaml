---
# Push ingestion door for external producers (for example Proxmox and TrueNAS).
# This keeps the name and node port (30080) that vminsert used so Flux updates
# the Service in place: creating a second Service that claims node port 30080
# before the old one is pruned would fail the apply and block the prune.
# The target port is the operator's named container port "http" (8429 by
# default, not 8428), which serves every ingestion and query endpoint. Naming it
# keeps this Service correct if the operator changes its default.
apiVersion: v1
kind: Service
metadata:
  name: vmcluster-victoria-metrics-cluster-vminsert-node-port
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/instance: vmsingle
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  ports:
    - name: vmsingle-http
      port: 8428
      targetPort: http
      nodePort: 30080
---
# Graphite push door for the TrueNAS Reporting Exporter. VictoriaMetrics serves
# Graphite plaintext on the same port over TCP and UDP.
apiVersion: v1
kind: Service
metadata:
  name: vmsingle-graphite-node-port
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/instance: vmsingle
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  ports:
    - name: graphite-tcp
      protocol: TCP
      port: 2003
      targetPort: 2003
      nodePort: 30003
    - name: graphite-udp
      protocol: UDP
      port: 2003
      targetPort: 2003
      nodePort: 30003
