---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: vmsingle
spec:
  retentionPeriod: "2y"
  image:
    repository: victoriametrics/victoria-metrics
    tag: v1.156.0
  # The "data" volume is mounted at storageDataPath. Naming the volume "data"
  # makes the operator use it instead of creating its own.
  storageDataPath: /victoria-metrics-data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: victoria-metrics-data
  # vmagent is the only scraper; the operator-managed scrape config is not used.
  ingestOnlyMode: true
  disableSelfServiceScrape: true
  extraArgs:
    # Graphite plaintext listener (TCP and UDP) for the TrueNAS Reporting
    # Exporter. The vmsingle-graphite-node-port Service publishes it.
    graphiteListenAddr: ":2003"
    # Forward Grafana's rules and alerts API calls (/api/v1/rules, /api/v1/alerts)
    # to vmalert. Without it VMSingle answers them with an empty list, so
    # Grafana's Alert rules page shows nothing. The vmalert Service is
    # deployments/base/alerting/vmalert.yaml.
    vmalert.proxyURL: http://vmalert-vmalert.default.svc.cluster.local:8080
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi
  podMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8429"
