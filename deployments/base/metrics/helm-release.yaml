---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
  namespace: default
spec:
  chart:
    spec:
      chart: victoria-metrics-agent
      sourceRef:
        kind: HelmRepository
        name: vm
      version: 0.52.0
  interval: 1m0s
  values:
    extraVolumes:
      - name: ha-bearer-token
        secret:
          secretName: home-assistant-token
    extraVolumeMounts:
      - name: ha-bearer-token
        mountPath: /etc/secrets/ha-bearer-token
        readOnly: true
    remoteWrite:
      - url: "http://vmsingle-vmsingle.default.svc.cluster.local:8428/api/v1/write"
    rbac:
      # The chart stopped granting nodes/proxy by default (chart v0.31.0), but the
      # kubelet and cAdvisor jobs below scrape through the API server node proxy.
      extraRules:
        - apiGroups: [""]
          resources:
            - nodes/proxy
          verbs: ["get"]
    config:
      global:
        scrape_interval: "10s"
        # The Kubernetes dashboards filter every query by a cluster label.
        external_labels:
          cluster: "home-ops"
      scrape_configs:
        - job_name: "hass"
          scrape_interval: "60s"
          metrics_path: "/api/prometheus"
          bearer_token_file: /etc/secrets/ha-bearer-token/token
          scheme: "http"
          static_configs:
            - targets:
                - "home-assistant:8123"
        - job_name: "vmagent"
          static_configs:
            - targets:
                - "localhost:8429"
        - job_name: "victoria-metrics"
          static_configs:
            - targets:
                - "vmsingle-vmsingle.default.svc.cluster.local:8428"
        - job_name: "vmalert"
          static_configs:
            - targets:
                - "vmalert-vmalert.default.svc.cluster.local:8080"
        - job_name: "alertmanager"
          static_configs:
            - targets:
                - "vmalertmanager-vmalertmanager.default.svc.cluster.local:9093"
        - job_name: "kubernetes-apiservers"
          kubernetes_sd_configs:
            - role: "endpoints"
          scheme: "https"
          tls_config:
            ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            insecure_skip_verify: true
          bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          relabel_configs:
            - source_labels:
                - "__meta_kubernetes_namespace"
                - "__meta_kubernetes_service_name"
                - "__meta_kubernetes_endpoint_port_name"
              action: "keep"
              regex: "default;kubernetes;https"
        # Host metrics from the node-exporter DaemonSet (deployments/base/exporters),
        # one target per node.
        - job_name: "node-exporter"
          kubernetes_sd_configs:
            - role: "endpoints"
          relabel_configs:
            - source_labels:
                - "__meta_kubernetes_namespace"
                - "__meta_kubernetes_service_name"
                - "__meta_kubernetes_endpoint_port_name"
              action: "keep"
              regex: "default;node-exporter;metrics"
            - source_labels:
                - "__meta_kubernetes_endpoint_node_name"
              target_label: "node"
        # Kubernetes object state (deployments/base/exporters). No namespace, pod
        # or node target labels are added here: they would collide with the labels
        # kube-state-metrics puts on its own series.
        - job_name: "kube-state-metrics"
          kubernetes_sd_configs:
            - role: "endpoints"
          relabel_configs:
            - source_labels:
                - "__meta_kubernetes_namespace"
                - "__meta_kubernetes_service_name"
                - "__meta_kubernetes_endpoint_port_name"
              action: "keep"
              regex: "default;kube-state-metrics;http"
        - job_name: "kubernetes-nodes"
          scheme: "https"
          tls_config:
            ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            insecure_skip_verify: true
          bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          kubernetes_sd_configs:
            - role: "node"
          relabel_configs:
            - action: "labelmap"
              regex: "__meta_kubernetes_node_label_(.+)"
            - source_labels:
                - "__meta_kubernetes_node_name"
              target_label: "node"
            - target_label: "__address__"
              replacement: "kubernetes.default.svc:443"
            - source_labels:
                - "__meta_kubernetes_node_name"
              regex: "(.+)"
              target_label: "__metrics_path__"
              replacement: "/api/v1/nodes/$1/proxy/metrics"
        - job_name: "kubernetes-nodes-cadvisor"
          scheme: "https"
          tls_config:
            ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            insecure_skip_verify: true
          bearer_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
          kubernetes_sd_configs:
            - role: "node"
          relabel_configs:
            - action: "labelmap"
              regex: "__meta_kubernetes_node_label_(.+)"
            - source_labels:
                - "__meta_kubernetes_node_name"
              target_label: "node"
            - target_label: "__address__"
              replacement: "kubernetes.default.svc:443"
            - source_labels:
                - "__meta_kubernetes_node_name"
              regex: "(.+)"
              target_label: "__metrics_path__"
              replacement: "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          metric_relabel_configs:
            - action: "replace"
              source_labels:
                - "pod"
              regex: "(.+)"
              target_label: "pod_name"
              replacement: "${1}"
            - action: "replace"
              source_labels:
                - "container"
              regex: "(.+)"
              target_label: "container_name"
              replacement: "${1}"
            - action: "replace"
              target_label: "name"
              replacement: "k8s_stub"
            - action: "replace"
              source_labels:
                - "id"
              regex: "^/system\\.slice/(.+)\\.service$"
              target_label: "systemd_service_name"
              replacement: "${1}"
