---
# Syslog door for external producers (Proxmox, Proxmox Backup Server, TrueNAS).
# The same node port number serves TCP and UDP.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-syslog-node-port
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vlsingle
    app.kubernetes.io/instance: vlsingle
    app.kubernetes.io/component: monitoring
    managed-by: vm-operator
  ports:
    - name: syslog-tcp
      protocol: TCP
      port: 5140
      targetPort: 5140
      nodePort: 30514
    - name: syslog-udp
      protocol: UDP
      port: 5140
      targetPort: 5140
      nodePort: 30514
