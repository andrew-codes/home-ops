apiVersion: apps/v1
kind: Deployment
metadata:
  name: ps5
  namespace: default
spec:
  # Step 1 of 2: pin the RollingUpdate parameters explicitly so kustomize-controller owns them.
  # maxSurge 0 and maxUnavailable 1 stop the old pod before the new one starts, which behaves like Recreate.
  # Step 2 still replaces this with type Recreate and drops the rollingUpdate block, which releases the owned field.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ps5
  template:
    metadata:
      labels:
        app: ps5
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ps5
          image: ghcr.io/andrew-codes/ps5-mqtt:edge
          imagePullPolicy: Always
          command:

          args:
            - "-c"
            - /app/run-standalone.sh
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /config/config.json
            - name: DEBUG
              value: "@ha:ps5:*"
          volumeMounts:
            - name: ps5-config
              mountPath: /config
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
      volumes:
        - name: ps5-config
          persistentVolumeClaim:
            claimName: ps5-config
