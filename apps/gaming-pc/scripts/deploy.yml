---
- hosts: all
  gather_facts: yes
  vars_files:
    - ../.secrets/ansible-secrets.yml

  tasks:
    - name: Set timezone to Eastern Time
      win_shell: tzutil /s "Eastern Standard Time"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # AllowMUUpdateService is what widens this from "Windows" to "and all other
    # Microsoft software" - it opts the machine into Microsoft Update rather
    # than Windows Update alone.
    - name: Configure Windows Update scheduled installs at 3 AM daily
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { name: NoAutoUpdate, data: 0 }
        - { name: AUOptions, data: 4 }
        - { name: ScheduledInstallDay, data: 0 }
        - { name: ScheduledInstallTime, data: 3 }
        - { name: AllowMUUpdateService, data: 1 }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Windows 11 largely drives restart timing from active hours rather than
    # from ScheduledInstallTime above, and left to itself it *learns* them from
    # usage - which on a machine that is awake 24/7 can settle anywhere. Pinning
    # 08:00-01:00 leaves 01:00-08:00 as the only window it may restart in, which
    # is where ScheduledInstallTime=3 already sits. 17 hours is inside the 18
    # hour maximum Windows accepts.
    - name: Restrict Windows Update restarts to the small hours
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { name: SetActiveHours, data: 1 }
        - { name: ActiveHoursStart, data: 8 }
        - { name: ActiveHoursEnd, data: 1 }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Microsoft Store apps update on their own schedule, outside Windows Update.
    # The three Store apps this playbook installs are covered by this rather
    # than by the policy above.
    - name: Keep Microsoft Store apps updating automatically
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\WindowsStore
        name: AutoDownload
        data: 4
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # The password is never logged: no_log covers the whole loop because the
    # DefaultPassword item would otherwise appear in Ansible's task output.
    - name: Enable automatic login
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: string
      loop:
        - { name: AutoAdminLogon, data: "1" }
        - { name: DefaultUserName, data: "{{ ansible_user }}" }
        - { name: DefaultDomainName, data: "{{ ansible_hostname }}" }
        - { name: DefaultPassword, data: "{{ windows_password }}" }
      become: yes
      become_method: runas
      no_log: true
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Beyond the ticket, but auto-login does not work without it: Windows 11
    # ships with passwordless sign-in for Microsoft accounts turned on, and
    # while it is on, Winlogon ignores DefaultPassword and stops at the sign-in
    # screen anyway. Setting this to 0 restores the password path that
    # AutoAdminLogon depends on.
    - name: Allow password-based sign-in so auto-login is honoured
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\PasswordLess\Device
        name: DevicePasswordLessBuildVersion
        data: 0
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Sleep and hibernation both off, on AC and on battery. Turning hibernation
    # off also disables Fast Startup, which is what makes Wake-on-LAN work from
    # a full shutdown further down - Fast Startup puts the NIC into a state that
    # ignores magic packets.
    #
    # `powercfg /change` is silent and always exits 0, so the current value is
    # read first. Without that this task would report "changed" on every deploy
    # and there would be no way to tell a real drift from a re-run.
    - name: Disable sleep and hibernation
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $changed = $false

          # powercfg's aliases are accepted as input in every locale; only its
          # *output* is localised, which is why a parse failure below falls
          # back to applying the setting rather than assuming it is correct.
          $timeouts = @(
            @{ Sub = 'SUB_SLEEP'; Setting = 'STANDBYIDLE'; Change = 'standby-timeout' },
            @{ Sub = 'SUB_SLEEP'; Setting = 'HIBERNATEIDLE'; Change = 'hibernate-timeout' },
            @{ Sub = 'SUB_VIDEO'; Setting = 'VIDEOIDLE'; Change = 'monitor-timeout' }
          )

          foreach ($timeout in $timeouts) {
            $query = & powercfg /query SCHEME_CURRENT $timeout.Sub $timeout.Setting 2>&1 | Out-String
            $indexes = [regex]::Matches($query, 'Setting Index:\s*(0x[0-9a-fA-F]+)')
            $alreadyZero = $indexes.Count -eq 2 -and
              ($indexes | ForEach-Object { [convert]::ToInt64($_.Groups[1].Value, 16) } |
                Where-Object { $_ -ne 0 } | Measure-Object).Count -eq 0

            if (-not $alreadyZero) {
              $changed = $true
              if (-not $Ansible.CheckMode) {
                & powercfg /change "$($timeout.Change)-ac" 0
                & powercfg /change "$($timeout.Change)-dc" 0
              }
            }
          }

          $hibernate = Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' `
            -Name HibernateEnabled -ErrorAction SilentlyContinue
          if ((-not $hibernate) -or $hibernate.HibernateEnabled -ne 0) {
            $changed = $true
            if (-not $Ansible.CheckMode) {
              & powercfg /hibernate off
            }
          }

          $Ansible.Changed = $changed
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Do not require password on wake from sleep
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Power\PowerSettings\0e796bdb-100d-47d6-a2d5-f7d2daa51f51
        name: "{{ item.name }}"
        data: 0
        type: dword
      loop:
        - { name: ACSettingIndex }
        - { name: DCSettingIndex }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Enable Wake-on-LAN on wired network adapters
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $changed = $false
          $adapters = @(Get-NetAdapter -Physical |
            Where-Object { $_.Status -eq 'Up' -and $_.MediaType -eq '802.3' })

          if ($adapters.Count -eq 0) {
            throw 'No wired adapter is up, so Wake-on-LAN cannot be configured.'
          }

          foreach ($adapter in $adapters) {
            $power = Get-NetAdapterPowerManagement -Name $adapter.Name -ErrorAction SilentlyContinue
            if (-not $power) {
              # Some virtual and USB NICs expose no power management at all.
              # That is a fact about the hardware, not a failure, but it must
              # not be silent either.
              Write-Warning "$($adapter.Name) exposes no power management; Wake-on-LAN not configured on it."
              continue
            }
            if ("$($power.WakeOnMagicPacket)" -eq 'Unsupported') {
              # Likewise hardware, not misconfiguration - and setting it anyway
              # would throw. Warn rather than fail so one incapable NIC beside a
              # capable one does not stop the deploy.
              Write-Warning "$($adapter.Name) does not support wake on magic packet; Wake-on-LAN not configured on it."
              continue
            }

            # Wake only on a magic packet, not on pattern match, which avoids
            # waking on ordinary broadcast traffic. The deploy does not manage
            # the "allow the computer to turn off this device to save power"
            # checkbox: it is left at the Windows default, which is the state
            # Wake-on-LAN needs. What the deploy does assert is wake on magic
            # packet here, plus arming the device to wake via powercfg below.
            $wanted = "$($power.WakeOnMagicPacket)" -ne 'Enabled' -or
              "$($power.WakeOnPattern)" -ne 'Disabled'
            if ($wanted) {
              $changed = $true
              if (-not $Ansible.CheckMode) {
                Set-NetAdapterPowerManagement -Name $adapter.Name `
                  -WakeOnMagicPacket Enabled -WakeOnPattern Disabled
              }
            }

            # "Allow this device to wake the computer". powercfg has no query
            # that answers per-device cheaply, so this is compared against the
            # list of devices already armed to wake.
            $armed = @(& powercfg /devicequery wake_armed 2>&1 | ForEach-Object { "$_".Trim() })
            if ($armed -notcontains $adapter.InterfaceDescription.Trim()) {
              $changed = $true
              if (-not $Ansible.CheckMode) {
                & powercfg /deviceenablewake "$($adapter.InterfaceDescription)"
              }
            }
          }

          $Ansible.Changed = $changed
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # This machine connects over wired Ethernet only - confirmed the address
    # in the generated inventory is the wired adapter's, not WiFi's, before
    # adding this, since disabling the wrong adapter would sever the deploy's
    # own SSH connection mid-run. Matched by MediaType rather than adapter
    # name, which varies by OEM/locale.
    - name: Disable WiFi network adapters
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $changed = $false
          $adapters = @(Get-NetAdapter -Physical |
            Where-Object { $_.MediaType -eq 'Native 802.11' -and $_.Status -ne 'Disabled' })

          foreach ($adapter in $adapters) {
            $changed = $true
            if (-not $Ansible.CheckMode) {
              Disable-NetAdapter -Name $adapter.Name -Confirm:$false
            }
          }

          $Ansible.Changed = $changed
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Disable notifications
      win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { path: 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\PushNotifications', name: ToastEnabled, data: 0 }
        - { path: 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: DisableNotificationCenter, data: 1 }
        # ToastEnabled above is the user-facing toggle and apps can prompt to
        # re-enable it; this is the policy that stops toasts outright.
        - { path: 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\PushNotifications', name: NoToastApplicationNotification, data: 1 }

    - name: Disable Xbox Game Bar
      win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        # The Settings > Gaming > Xbox Game Bar toggle itself.
        - { path: 'HKCU:\System\GameConfigStore', name: GameDVR_Enabled, data: 0 }
        # Background game-capture, a separate switch from the toggle above.
        - { path: 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR', name: AppCaptureEnabled, data: 0 }

    # The machine-wide policy, not just the per-user toggle: this is what
    # actually stops Win+G from opening Game Bar at all, and greys out the
    # Settings toggle rather than leaving it re-enableable.
    - name: Disable Xbox Game Bar via policy
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR
        name: AllowGameDVR
        data: 0
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # A single semicolon-delimited string (e.g. "AutoHDREnable=1;GpuPreference=2;"),
    # not a dword - the same DirectXUserGlobalSettings value also carries
    # unrelated per-user DirectX preferences, so this parses the existing
    # string and only touches the AutoHDREnable key rather than overwriting
    # the whole value. Software-only: unlike physical HDR display output,
    # this does not touch display signaling, so there is no risk of a broken
    # display state.
    - name: Enable Auto HDR
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKCU:\SOFTWARE\Microsoft\DirectX\UserGpuPreferences'
          if (-not (Test-Path $path)) {
            New-Item -Path $path -Force | Out-Null
          }

          $current = (Get-ItemProperty -Path $path -Name DirectXUserGlobalSettings -ErrorAction SilentlyContinue).DirectXUserGlobalSettings
          $pairs = [ordered]@{}
          if ($current) {
            foreach ($pair in ($current -split ';' | Where-Object { $_ })) {
              $key, $value = $pair -split '=', 2
              $pairs[$key] = $value
            }
          }

          if ($pairs['AutoHDREnable'] -eq '1') {
            $Ansible.Changed = $false
            return
          }

          $Ansible.Changed = $true
          if (-not $Ansible.CheckMode) {
            $pairs['AutoHDREnable'] = '1'
            $newValue = ($pairs.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ';'
            $newValue += ';'
            New-ItemProperty -Path $path -Name DirectXUserGlobalSettings -Value $newValue -PropertyType String -Force | Out-Null
          }

    - name: Enable dark mode
      win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { name: AppsUseLightTheme, data: 0 }
        - { name: SystemUsesLightTheme, data: 0 }

    - name: Hide desktop icons
      win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        name: HideIcons
        data: 1
        type: dword

    - name: Hide Recycle Bin from desktop
      win_regedit:
        path: HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel
        name: '{645FF040-5081-101B-9F08-00AA002F954E}'
        data: 1
        type: dword

    - name: Disable taskbar widgets via policy
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Dsh
        name: AllowNewsAndInterests
        data: 0
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Disable taskbar task view and search box
      win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ShowTaskViewButton, data: 0 }
        - { path: 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search', name: SearchboxTaskbarMode, data: 0 }
      # No per-user TaskbarDa write here: once the machine policy above
      # (AllowNewsAndInterests) is live, Windows' policy engine takes
      # ownership of this user's TaskbarDa value and locks it - a direct
      # write, elevated or not, fails with "Attempted to perform an
      # unauthorized operation." The machine policy alone already removes
      # the widgets button; this was only ever a redundant cosmetic write.

    # Auto-hide lives in one byte of an opaque blob, and applying it needs
    # Explorer restarted to be visible. Restarting Explorer unconditionally
    # would make every deploy "changed" - and would kill the captain's session
    # mid-game on a re-run - so the byte is compared first.
    - name: Auto-hide taskbar
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $path = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\StuckRects3'
          $settings = (Get-ItemProperty -Path $path -Name Settings).Settings

          # Byte 8 is a flags byte; bit 0 is auto-hide.
          if (($settings[8] -band 0x01) -eq 0x01) {
            $Ansible.Changed = $false
            return
          }

          $Ansible.Changed = $true
          if (-not $Ansible.CheckMode) {
            $settings[8] = $settings[8] -bor 0x01
            Set-ItemProperty -Path $path -Name Settings -Value $settings
            Get-Process -Name explorer -ErrorAction SilentlyContinue | Stop-Process -Force
          }

    - name: Remove unwanted Microsoft apps
      win_shell: |
        $packages = @(
          'Microsoft.OutlookForWindows',
          'Microsoft.Copilot',
          'MSTeams',
          'Microsoft.Todos'
        )
        foreach ($pkg in $packages) {
          Get-AppxPackage -Name $pkg -AllUsers | Remove-AppxPackage -AllUsers -ErrorAction SilentlyContinue
          Get-AppxProvisionedPackage -Online | Where-Object DisplayName -eq $pkg | Remove-AppxProvisionedPackage -Online -ErrorAction SilentlyContinue
        }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Disable Edge password manager
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
        name: PasswordManagerEnabled
        data: 0
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # The captain's explicit instruction for this dedicated gaming machine
    # (HO-239). EnableLUA=0 only takes effect after a reboot; the other two
    # values stop the consent prompt in the meantime, and keep it gone if a
    # Windows update ever restores EnableLUA.
    - name: Disable UAC
      win_regedit:
        path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: dword
      loop:
        - { name: EnableLUA, data: 0 }
        - { name: ConsentPromptBehaviorAdmin, data: 0 }
        - { name: PromptOnSecureDesktop, data: 0 }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Windows Defender flags the Chocolatey bootstrap's own
    # WebClient.DownloadString + iex line as Trojan:Win32/GoptaJu.D - a known
    # false positive on this fileless-download pattern (see
    # https://github.com/chocolatey/choco/issues/2132) - and removes the
    # running PowerShell process mid-task. `pre-deploy` requires Tamper
    # Protection to be off before a deploy is attempted (see "First-time
    # setup" in README.md) specifically so the toggle below can take effect:
    # with Tamper Protection on, `Set-MpPreference` silently no-ops instead
    # of erroring, which was tried and looked like it worked but did not.
    # Real-time protection is disabled only for the duration of the install
    # below and always re-enabled immediately after (the `always` block),
    # rather than adding a permanent exclusion.
    - name: Install Chocolatey without Windows Defender flagging the bootstrap
      block:
        - name: Disable Windows Defender real-time monitoring for the Chocolatey install
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              if ((Get-MpPreference).DisableRealtimeMonitoring) {
                $Ansible.Changed = $false
                return
              }
              $Ansible.Changed = $true
              if (-not $Ansible.CheckMode) {
                Set-MpPreference -DisableRealtimeMonitoring $true
              }
          become: yes
          become_method: runas
          vars:
            ansible_become_user: "{{ ansible_user }}"
            ansible_become_password: "{{ windows_password }}"

        - name: Ensure Chocolatey is installed
          win_shell: |
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          args:
            creates: C:\ProgramData\chocolatey\bin\choco.exe
          become: yes
          become_method: runas
          vars:
            ansible_become_user: "{{ ansible_user }}"
            ansible_become_password: "{{ windows_password }}"
      always:
        - name: Re-enable Windows Defender real-time monitoring
          ansible.windows.win_powershell:
            script: |
              $ErrorActionPreference = 'Stop'
              if (-not (Get-MpPreference).DisableRealtimeMonitoring) {
                $Ansible.Changed = $false
                return
              }
              $Ansible.Changed = $true
              if (-not $Ansible.CheckMode) {
                Set-MpPreference -DisableRealtimeMonitoring $false
              }
          become: yes
          become_method: runas
          vars:
            ansible_become_user: "{{ ansible_user }}"
            ansible_become_password: "{{ windows_password }}"

    - name: Ensure PowerShell 7 is installed
      win_chocolatey:
        name: powershell-core
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Install AudioDeviceCmdlets PowerShell module
      win_shell: |
        pwsh -Command "Install-Module -Name AudioDeviceCmdlets -Force -Scope CurrentUser"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure Epic Games Launcher is absent
      win_chocolatey:
        name: epicgameslauncher
        state: absent
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Playnite, Discord, and VS Code are kept absent by src/software.ps1
    # further down, which also hunts the per-user Discord that no package
    # manager can see.

    - name: Ensure 7-Zip is installed
      win_chocolatey:
        name: 7zip
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # The one package on HO-239's list that winget cannot deliver: NVIDIA
    # publishes no NVIDIA App manifest to the community winget source (the
    # Nvidia publisher there carries CUDA, FrameView, PhysX and friends, but not
    # the app), so Chocolatey stays for this one. The *driver* is a separate
    # concern and is handled by src/run.ps1 further down.
    - name: Ensure NVIDIA App is installed
      win_chocolatey:
        name: nvidia-app
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Apollo, 1Password, Logi Options+, Tailscale, Zed and Steam are installed
    # by src/software.ps1 via winget, and Raycast, Windows HDR Calibration and
    # Dolby Access from the Microsoft Store by the same script.

    - name: Ensure rsync is installed
      win_chocolatey:
        name: msys2
        state: absent
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure rsync is installed
      win_chocolatey:
        name: rsync
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # - name: Ensure node is installed
    #   win_chocolatey:
    #     name: nodejs
    #     state: present

    # - name: Ensure Git is installed
    #   win_chocolatey:
    #     name: git
    #     package_params: /GitAndUnixToolsOnPath /NoShellIntegration
    #     state: present

    # SSH is both the machine's remote access method and Ansible's own
    # transport, so these tasks re-assert the configuration the connection
    # depends on. Use the OpenSSH server that ships with Windows: Ansible
    # officially supports only that implementation, not the upstream build
    # the Chocolatey `openssh` package installs.
    - name: Ensure the OpenSSH server that ships with Windows is installed
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online -Name 'OpenSSH.Server*' |
            Select-Object -First 1
          if (-not $capability) {
            throw 'OpenSSH.Server is unavailable on this Windows build.'
          }
          if ($capability.State -eq 'Installed') {
            $Ansible.Changed = $false
          } else {
            $Ansible.Changed = $true
            if (-not $Ansible.CheckMode) {
              Add-WindowsCapability -Online -Name $capability.Name | Out-Null
            }
          }
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Must stay in step with ansible_shell_type in the generated inventory.
    - name: Use PowerShell as the default shell for SSH sessions
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure the sshd service is running and starts on boot
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Left on every profile, matching the rule Add-WindowsCapability creates. A
    # private-only rule would lock provisioning out of a fresh machine whose
    # network is still classified Public.
    - name: Enable SSH through firewall
      community.windows.win_firewall_rule:
        name: OpenSSH-Server-In-TCP
        description: "Inbound rule for the OpenSSH server (sshd) on TCP port 22"
        direction: In
        protocol: tcp
        localport: 22
        action: Allow
        enabled: yes
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Enable HA Ping through firewall
      win_firewall_rule:
        name: "HA Ping"
        description: "Allow ping from Home Assistant"
        direction: In
        protocol: icmpv4
        icmp_type_code:
          - "8:*"
        profiles: private
        action: Allow
        enabled: yes
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # The profile folder the authorized keys are written to comes from the
    # 1Password entry `gaming-pc/user`, which is a separate entry from the
    # `gaming-pc/username` that supplies `ansible_user`. The deployed
    # `src/sshd_config` authenticates administrators from their own
    # `%USERPROFILE%\.ssh\authorized_keys`, so keys written to a non-existent
    # profile would silently lock every later run out of the machine.
    - name: Resolve the profile directory the SSH keys belong to
      ansible.builtin.set_fact:
        ssh_profile_path: 'C:\Users\{{ user }}'

    - name: Locate the Windows profile directory the SSH keys belong to
      ansible.windows.win_stat:
        path: "{{ ssh_profile_path }}"
      register: ssh_profile_directory

    - name: Fail when the SSH key profile directory does not exist
      ansible.builtin.fail:
        msg: >-
          The 1Password entry `gaming-pc/user` resolved to "{{ user }}", but
          {{ ssh_profile_path }} does not exist on this host. Writing
          authorized_keys there would leave the connecting account without a
          key and break every subsequent provisioning run. Set `gaming-pc/user`
          to the Windows profile folder of the account in
          `gaming-pc/username`.
      when: not ssh_profile_directory.stat.exists

    - name: Fail when the profile directory is not the connecting account's own
      ansible.builtin.fail:
        msg: >-
          The 1Password entry `gaming-pc/user` resolved to "{{ user }}", giving
          the profile path {{ ssh_profile_path }}, but the connecting account
          "{{ ansible_user }}" reports USERPROFILE as
          "{{ ansible_env.USERPROFILE | default('<not reported by the host>') }}".
          That folder exists but belongs to a different account, so the keys
          would be installed where nobody authenticates from and the deployed
          sshd_config would then remove the shared
          administrators_authorized_keys fallback, locking later runs out. Set
          `gaming-pc/user` to the profile folder of `gaming-pc/username`.
      when: >-
        ansible_env.USERPROFILE | default('') | lower
        != ssh_profile_path | lower

    - name: Ensure .ssh directory exists
      win_file:
        path: '{{ ssh_profile_path }}\.ssh'
        state: directory
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Read authorized_keys source
      set_fact:
        authorized_keys_content: "{{ lookup('file', '../.secrets/authorized_keys') }}"

    - name: Ensure authorized_keys contains each required key
      win_lineinfile:
        path: '{{ ssh_profile_path }}\.ssh\authorized_keys'
        line: "{{ item }}"
        create: yes
      loop: "{{ authorized_keys_content.splitlines() | select('match', '.+') | list }}"
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Copy sshd_config
      ansible.windows.win_copy:
        src: ../src/sshd_config
        dest: C:\ProgramData\ssh\sshd_config
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"
        ansible_remote_tmp: 'C:\tmp'

    - name: Restart SSH Service
      win_shell: |
        Get-Service -Name sshd | Restart-Service
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Enable Remote Desktop
      win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Enable RDP through firewall
      win_shell: |
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure andrew local user exists
      win_user:
        name: andrew
        password: "{{ andrew_password }}"
        password_never_expires: yes
        state: present
        groups:
          - Administrators
        groups_action: add
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure andrew .ssh directory exists
      win_file:
        path: C:\Users\andrew\.ssh
        state: directory
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure andrew authorized_keys contains each required key
      win_lineinfile:
        path: C:\Users\andrew\.ssh\authorized_keys
        line: "{{ item }}"
        create: yes
      loop: "{{ authorized_keys_content.splitlines() | select('match', '.+') | list }}"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Add users to Remote Desktop Users group
      win_group_membership:
        name: "Remote Desktop Users"
        members:
          - "{{ ansible_user }}"
          - andrew
        state: present
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Ensure developer/tools directory exists
      win_file:
        path: C:\Users\{{ user }}\developer\tools
        state: directory
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Get latest gsync-toggle release info
      win_uri:
        url: https://api.github.com/repos/FrogTheFrog/gsync-toggle/releases/latest
        method: GET
        headers:
          Accept: application/vnd.github.v3+json
        return_content: yes
      register: gsync_release

    - name: Download latest gsync-toggle executable
      win_get_url:
        url: "{{ (gsync_release.json.assets | selectattr('name', 'match', '.*\\.exe$') | first).browser_download_url }}"
        dest: C:\Users\{{ user }}\developer\tools\gsync.exe
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Add developer/tools to user PATH
      win_path:
        elements: C:\Users\{{ user }}\developer\tools
        scope: user
        state: present

    # win_copy is documented as unreliable at detecting *changed* existing
    # files during a directory-mode copy (it diffs new files fine, but a
    # modified file already present at the destination can silently keep its
    # old content) - confirmed here when a rewritten nut-client.ps1 stayed
    # stale on a real host across a re-deploy. Removing the destination first
    # forces every deploy to get an exact, fresh copy regardless of what
    # win_copy's own diffing decides.
    - name: Remove existing developer/tools before copying fresh
      ansible.windows.win_file:
        path: C:\Users\{{ user }}\developer\tools
        state: absent
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Copy scripts to developer/tools
      ansible.windows.win_copy:
        src: ../src/
        dest: C:\Users\{{ user }}\developer\tools\
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"
        ansible_remote_tmp: 'C:\tmp'

    # HO-239's software list. Split in two because elevation is a property of
    # the process: machine-scope winget installers need it, and the Microsoft
    # Store's MSIX packages plus the per-user MoonDeck Buddy installer must not
    # have it or they land in the wrong place. Both phases are idempotent and
    # report what they changed on their last line, which is what changed_when
    # reads; see src/software.ps1.
    - name: Install and remove software (machine scope)
      win_shell: |
        pwsh -NoProfile -File "C:\Users\{{ user }}\developer\tools\software.ps1" -Phase Machine
      register: software_machine
      changed_when: "'changed=0 ' not in software_machine.stdout"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Must run after the machine-scope software install above, not before:
    # Steam itself is installed there via winget ($MachinePackages in
    # software.ps1), and this only needs the path it installs to (the same
    # one the Chocolatey package used). Setting this any earlier would point
    # the gaming account's shell at a Steam.exe that does not exist yet,
    # breaking that account's desktop on any login that happens before a
    # deploy finishes.
    - name: Set Steam Big Picture as default shell for gaming user
      win_regedit:
        path: HKCU:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon
        name: Shell
        data: "C:\\Program Files (x86)\\Steam\\Steam.exe -bigpicture"
        type: string

    - name: Install software (user scope, including Microsoft Store apps)
      win_shell: |
        pwsh -NoProfile -File "C:\Users\{{ user }}\developer\tools\software.ps1" -Phase User
      register: software_user
      changed_when: "'changed=0 ' not in software_user.stdout"

    # Microsoft Store installs are deliberately non-fatal, so a failure leaves
    # the task green and Ansible hides win_shell stdout on a green task. Print
    # it when the run recorded any warning, so a failed Store app is visible.
    - name: Show the user-scope software output when it recorded warnings
      ansible.builtin.debug:
        var: software_user.stdout_lines
      when: "'warnings=0' not in software_user.stdout"

    # Zed registers itself as *a* handler for these types when winget installs
    # it; this policy is what makes it the default. Windows applies it at user
    # sign-in, so it takes effect on the next login rather than immediately.
    - name: Ensure the default-associations directory exists
      ansible.windows.win_file:
        path: C:\ProgramData\gaming-pc
        state: directory
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Copy the Zed default file associations
      ansible.windows.win_copy:
        src: ../src/default-associations.xml
        dest: C:\ProgramData\gaming-pc\default-associations.xml
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"
        ansible_remote_tmp: 'C:\tmp'

    - name: Make Zed the default application for text and code files
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\System
        name: DefaultAssociationsConfiguration
        data: C:\ProgramData\gaming-pc\default-associations.xml
        type: string
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    - name: Run install.ps1
      win_shell: |
        pwsh -NoProfile -File "C:\Users\{{ user }}\developer\tools\install.ps1"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # The NVIDIA game-ready driver. src/run.ps1 compares the installed version
    # against NVIDIA's latest and returns without downloading anything when they
    # match, which is what "only install if not already on latest" asks for.
    # It is also the payload of the nightly Update-Gaming-PC task that
    # install.ps1 registers above; running it here means a freshly rebuilt
    # machine gets its driver during the deploy instead of at the next midnight.
    - name: Update the NVIDIA game-ready driver if one is available
      win_shell: |
        pwsh -NoProfile -File "C:\Users\{{ user }}\developer\tools\run.ps1"
      register: nvidia_driver
      changed_when: "'No update needed' not in nvidia_driver.stdout"
      become: yes
      become_method: runas
      vars:
        ansible_become_user: "{{ ansible_user }}"
        ansible_become_password: "{{ windows_password }}"

    # Deliberately the last task in the playbook: the NUT server has not been
    # provisioned yet (out of scope for this repo), so this is expected to
    # fail until it is. Kept failing rather than made best-effort - a
    # misconfigured client here can shut this host down unexpectedly, so
    # silently tolerating a bad config would be worse than blocking the
    # deploy. Ordered last so everything else still completes first. Kept as
    # its own task, separate from the software.ps1 install above, so only
    # this one is no_log'd - see README.md#nut-ups-monitoring.
    - name: Configure and start WinNUT-Client (UPS monitoring)
      win_shell: |
        pwsh -NoProfile -File "C:\Users\{{ user }}\developer\tools\configure-nut-client.ps1"
      register: nut_client_config
      changed_when: "'configure=Configured' in nut_client_config.stdout or 'start=Started' in nut_client_config.stdout"
      no_log: true
      environment:
        NUT_SERVER_ADDRESS: "{{ nut_server_address }}"
        NUT_SERVER_PORT: "{{ nut_server_port }}"
        NUT_UPS_NAME: "{{ nut_ups_name }}"
        NUT_MONITOR_USERNAME: "{{ nut_monitor_username }}"
        NUT_MONITOR_PASSWORD: "{{ nut_monitor_password }}"
        NUT_BATTERY_CHARGE_FLOOR: "{{ nut_battery_charge_floor }}"
