# vmalert-tool unit tests for the incident related rules in
# deployments/base/alerting/vmrules.yaml. scripts/test-rules.sh merges the rule
# groups into base-rules.yaml next to this file's copy and runs
# `vmalert-tool unittest`.
rule_files:
  - base-rules.yaml

# vmalert-tool starts its clock at 2000-01-01T00:00:00Z (unix 946684800), so the
# heartbeat timestamps below are absolute, not relative to zero.

evaluation_interval: 1m

tests:
  # A down scrape target is only a warning, but it still opens an incident.
  - name: a down target carries the incident label
    interval: 1m
    input_series:
      - series: 'up{job="hass",instance="hass.default.svc:8123"}'
        values: "1x5 0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              incident: "true"
              job: hass
              instance: hass.default.svc:8123
            exp_annotations:
              summary: "hass is down"
              description: "Scrape target hass.default.svc:8123 (job hass) has reported up=0 for 5 minutes. Its metrics are not being collected and the service may be down."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=VictoriaMetrics

  # Critical alerts open an incident through their severity, so no label is
  # needed and the rule must not set one.
  - name: a critical alert needs no incident label
    interval: 1m
    input_series:
      - series: 'up{job="kubernetes-nodes",kubernetes_io_hostname="k8s-main"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeletDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: kubernetes-nodes
              kubernetes_io_hostname: k8s-main
            exp_annotations:
              summary: "Kubernetes node k8s-main is unreachable"
              description: "The kubelet on node k8s-main (job kubernetes-nodes) has reported up=0 for 5 minutes. The node may be down or not ready, and the pods on it may be offline."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes

  # Every minute the disk completes 60 writes and spends 30 s on them, so a
  # write takes half a second.
  - name: a stalled disk fires the write latency and I/O pressure alerts
    interval: 1m
    input_series:
      - series: 'node_disk_write_time_seconds_total{job="node-exporter",device="nvme0n1",node="k8s-main"}'
        values: "0+30x30"
      - series: 'node_disk_writes_completed_total{job="node-exporter",device="nvme0n1",node="k8s-main"}'
        values: "0+60x30"
      - series: 'node_disk_write_time_seconds_total{job="node-exporter",device="dm-3",node="k8s-main"}'
        values: "0+30x30"
      - series: 'node_disk_writes_completed_total{job="node-exporter",device="dm-3",node="k8s-main"}'
        values: "0+60x30"
      # 30 s stalled per 60 s.
      - series: 'node_pressure_io_stalled_seconds_total{job="node-exporter",node="k8s-main"}'
        values: "0+30x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: NodeDiskWriteLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              device: nvme0n1
              node: k8s-main
            exp_annotations:
              summary: "Disk nvme0n1 on node k8s-main is writing slowly"
              description: "Writes to nvme0n1 on node k8s-main took 500ms on average over the last 5 minutes (normal is a few milliseconds). The drive is stalling, which slows etcd and the API server and can restart the control plane components."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter
      - eval_time: 10m
        alertname: NodeIOStallPressureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              node: k8s-main
            exp_annotations:
              summary: "Node k8s-main is stalled on disk I/O"
              description: "All tasks on node k8s-main were stalled waiting for disk I/O 50% of the time over the last 5 minutes. The disk is not completing requests."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=Node%20Exporter

  # A healthy disk completes writes in about 2.5 ms and is stalled 1% of the time.
  - name: a healthy disk stays quiet
    interval: 1m
    input_series:
      - series: 'node_disk_write_time_seconds_total{job="node-exporter",device="nvme0n1",node="k8s-main"}'
        values: "0+0.15x30"
      - series: 'node_disk_writes_completed_total{job="node-exporter",device="nvme0n1",node="k8s-main"}'
        values: "0+60x30"
      - series: 'node_pressure_io_stalled_seconds_total{job="node-exporter",node="k8s-main"}'
        values: "0+0.6x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeDiskWriteLatencyHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: NodeIOStallPressureHigh
        exp_alerts: []

  # Every minute 58 of 60 fsyncs finish within 5 ms and two take longer than a
  # second. Of 60 API requests a minute, 50 take longer than 10 s.
  - name: slow etcd fsync and slow API requests fire
    interval: 1m
    input_series:
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd",instance="10.2.0.144:2381",node="k8s-main",le="0.005"}'
        values: "0+58x30"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd",instance="10.2.0.144:2381",node="k8s-main",le="1"}'
        values: "0+58x30"
      - series: 'etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd",instance="10.2.0.144:2381",node="k8s-main",le="+Inf"}'
        values: "0+60x30"
      - series: 'apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers",instance="10.2.0.144:6443",verb="GET",le="1"}'
        values: "0+10x30"
      - series: 'apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers",instance="10.2.0.144:6443",verb="GET",le="10"}'
        values: "0+10x30"
      - series: 'apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers",instance="10.2.0.144:6443",verb="GET",le="+Inf"}'
        values: "0+60x30"
      # Watches stay open for minutes and must not count.
      - series: 'apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers",instance="10.2.0.144:6443",verb="WATCH",le="1"}'
        values: "0+0x30"
      - series: 'apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers",instance="10.2.0.144:6443",verb="WATCH",le="+Inf"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: EtcdSlowFsync
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: "10.2.0.144:2381"
              node: k8s-main
            exp_annotations:
              summary: "etcd on node k8s-main is syncing to disk slowly"
              description: "The 99th percentile of etcd's write ahead log fsync on 10.2.0.144:2381 is 1s over the last 5 minutes (it should be milliseconds). The disk under /var/lib/etcd is stalling, and the API server will be slow or time out."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes
      - eval_time: 10m
        alertname: KubeAPIServerSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: "10.2.0.144:6443"
            exp_annotations:
              summary: "Kubernetes API server is answering slowly"
              description: "The 99th percentile of API server request time on 10.2.0.144:6443 is 10s over the last 5 minutes. Controllers can miss their leader election deadline and restart. The usual cause is etcd waiting on a stalled disk, see EtcdSlowFsync and NodeDiskWriteLatencyHigh."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=Kubernetes

  # The heartbeat moves forward every minute.
  - name: a working sync stays quiet
    interval: 1m
    input_series:
      - series: 'incident_ack_sync_last_success_timestamp_seconds{job="incident-ack-sync",instance="incident-ack-sync.default.svc.cluster.local:9100"}'
        values: "946684800+60x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: IncidentAckSyncFailing
        exp_alerts: []

  # The last success was at the start. Half an hour later the rule is true, five
  # more minutes and it fires. A service that never succeeds looks the same: its
  # heartbeat stays at the process start time.
  - name: a sync that stopped succeeding fires
    interval: 1m
    input_series:
      - series: 'incident_ack_sync_last_success_timestamp_seconds{job="incident-ack-sync",instance="incident-ack-sync.default.svc.cluster.local:9100"}'
        values: "946684800x120"
    alert_rule_test:
      - eval_time: 33m
        alertname: IncidentAckSyncFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: IncidentAckSyncFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: incident-ack-sync
              instance: incident-ack-sync.default.svc.cluster.local:9100
            exp_annotations:
              summary: "Incident acknowledgement sync is failing"
              description: "The incident-ack-sync service has not succeeded for 40m 0s. Work items moved to In Progress no longer silence their alerts, so pushes for them continue. Check the pod logs of the incident-ack-sync Deployment in the default namespace, and the jira-user and jira-api-token fields of the alertmanager-receivers secret."

  # The service is down: no heartbeat at all, so the down target reports it.
  - name: a sync whose target is down is reported by TargetDown
    interval: 1m
    input_series:
      - series: 'up{job="incident-ack-sync",instance="incident-ack-sync.default.svc.cluster.local:9100"}'
        values: "1x5 0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              incident: "true"
              job: incident-ack-sync
              instance: incident-ack-sync.default.svc.cluster.local:9100
            exp_annotations:
              summary: "incident-ack-sync is down"
              description: "Scrape target incident-ack-sync.default.svc.cluster.local:9100 (job incident-ack-sync) has reported up=0 for 5 minutes. Its metrics are not being collected and the service may be down."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=VictoriaMetrics
