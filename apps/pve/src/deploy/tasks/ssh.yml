---
- name: Ensure /root/.ssh exists with correct permissions
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure /root/.ssh/authorized_keys exists
  ansible.builtin.file:
    path: /root/.ssh/authorized_keys
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Ensure the captain's SSH public key is authorized for root
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ captain_ssh_public_key }}"
    state: present
    owner: root
    group: root
    mode: "0600"
