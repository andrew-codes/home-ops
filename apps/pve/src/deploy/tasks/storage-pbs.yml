---
- name: Check whether the pbs-nas storage is already registered
  ansible.builtin.command: pvesm status --storage pbs-nas
  register: pbs_status
  ignore_errors: true
  changed_when: false

- name: Read the registered pbs-nas storage config
  ansible.builtin.command: pvesh get /storage/pbs-nas --output-format json
  register: pbs_config
  when: pbs_status.rc == 0
  changed_when: false

- name: Require a TLS fingerprint when the PBS server is new or changing
  ansible.builtin.assert:
    that:
      - pbs_fingerprint | default('') | length > 0
    fail_msg: >-
      pbs-nas is being created or repointed to {{ pbs_host }} but pbs/fingerprint
      is empty in 1Password. Get it on the PBS with `proxmox-backup-manager cert info`
      and add it as the `fingerprint` field of the `pbs` item.
  when: >-
    pbs_status.rc != 0 or
    (pbs_config.stdout | from_json).server | default('') != pbs_host

- name: Add the Proxmox Backup Server storage (storage id pbs-nas, datastore from pbs_datastore)
  ansible.builtin.command: >
    pvesm add pbs pbs-nas
    --server {{ pbs_host }}
    --datastore {{ pbs_datastore }}
    --username {{ pbs_username }}
    --password {{ pbs_password }}
    {{ ('--fingerprint ' ~ pbs_fingerprint) if pbs_fingerprint | default('') | length > 0 else '' }}
  when: pbs_status.rc != 0
  no_log: true
  register: pbs_add

- name: Reconcile pbs-nas storage settings if it already exists
  ansible.builtin.command: >
    pvesm set pbs-nas
    --server {{ pbs_host }}
    --datastore {{ pbs_datastore }}
    --username {{ pbs_username }}
    --password {{ pbs_password }}
    {{ ('--fingerprint ' ~ pbs_fingerprint) if pbs_fingerprint | default('') | length > 0 else '' }}
  when: pbs_status.rc == 0
  no_log: true
  changed_when: false

- name: Report pbs-nas storage state
  ansible.builtin.debug:
    msg: >-
      {{ 'Registered pbs-nas storage' if pbs_status.rc != 0
         else 'pbs-nas storage already registered, settings reconciled' }}
