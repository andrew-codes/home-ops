---
# Sends the logs of the Proxmox guests (LXC containers and Linux VMs) to the
# cluster's VictoriaLogs. It runs the same tasks/logs.yml as the host, so a
# guest's journal and syslog land in VictoriaLogs with the same hostname,
# app_name and level fields. Guests only forward logs: they have no metric
# server of their own, and nothing here changes their network, packages other
# than rsyslog, or services other than rsyslog. See
# scripts/deploy-guest-observability.ts for which guests it targets.
- name: Send Proxmox guest logs to the cluster
  hosts: all
  become: yes
  become_method: ansible.builtin.sudo
  become_user: root
  gather_facts: yes
  remote_user: root
  vars:
    # Where VictoriaLogs (syslog) is published on the Kubernetes node.
    # observability_host is passed in by scripts/deploy-guest-observability.ts.
    observability_syslog_port: 30514
    # Display name the guest's logs carry in VictoriaLogs, looked up by the
    # guest's address. observability_guest_names is passed in by
    # scripts/deploy-guest-observability.ts. It replaces the OS hostname, which
    # can be localhost or blank, and the OS hostname itself is left alone.
    observability_hostname: "{{ observability_guest_names[inventory_hostname] }}"
  handlers:
    - import_tasks: handlers/main.yml

  tasks:
    - name: Forward logs to VictoriaLogs
      ansible.builtin.import_tasks: tasks/logs.yml
      tags: [observability]

# Only the Kubernetes node: its pods create and delete veth links, and
# networkd-dispatcher logs an error for each one that is gone by the time it
# looks. The other guests have no such links, so they are left alone.
- name: Quiet pod network link logs on the Kubernetes node
  hosts: all
  become: yes
  become_method: ansible.builtin.sudo
  become_user: root
  gather_facts: no
  remote_user: root
  tasks:
    - name: Stop pod veth churn from logging
      ansible.builtin.import_tasks: ../../../../resources/k8s/src/deployment/tasks/quiet-pod-link-events.yml
      when: inventory_hostname == observability_host
      tags: [observability]
