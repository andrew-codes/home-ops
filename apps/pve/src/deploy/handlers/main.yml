---
- name: update grub
  ansible.builtin.command: update-grub
  listen: update grub

- name: update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  listen: update initramfs

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  listen: restart rsyslog
