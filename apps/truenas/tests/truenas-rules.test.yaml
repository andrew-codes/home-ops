# vmalert-tool unit tests for deployments/production/alerting/truenas-vmrules.yaml.
# scripts/test-rules.sh extracts the rule groups into truenas-rules.yaml next to
# this file's copy and runs `vmalert-tool unittest`. Series are named the way
# the Graphite exporter delivers them: dotted names, no labels.
#
# The disk temperature series reach VictoriaMetrics 15 to 20 minutes after the
# time they carry, so at any moment the newest sample is that old. The tests
# below model that lag with samples that stop 15 to 40 minutes before the
# evaluation time. A series that ends and never comes back stands for a
# collector that stopped.
rule_files:
  - truenas-rules.yaml

evaluation_interval: 1m

tests:
  # One disk goes quiet while the others keep reporting: the alert fires.
  - name: one disk vanishes
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40x30"
      - series: '{__name__="truenas.nas.truenas_disk_temp.diskb.temp"}'
        values: "41x120"
    alert_rule_test:
      - eval_time: 40m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: TrueNASDiskMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              disk: diska
            exp_annotations:
              summary: "TrueNAS disk diska stopped reporting"
              description: "Disk diska reported a temperature in the last day but has had no sample for 45 minutes, while the other disks still report (last value 40°C). The disk may have failed or dropped off its controller. Check the pool in the TrueNAS UI."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The whole push stream pauses for 20 minutes, as it does when VictoriaMetrics
  # restarts. Every disk goes quiet at once: the per-disk alert stays silent.
  - name: all disks pause for 20 minutes
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40x30 _x20 40x60"
      - series: '{__name__="truenas.nas.truenas_disk_temp.diskb.temp"}'
        values: "41x30 _x20 41x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 48m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 55m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 90m
        alertname: TrueNASDiskMissing
        exp_alerts: []

  # The stream stops and does not come back. TrueNASDiskTemperatureMetricsMissing
  # and TrueNASMetricsMissing own this case, not the per-disk alert.
  - name: all disks stay gone
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40x30"
      - series: '{__name__="truenas.nas.truenas_disk_temp.diskb.temp"}'
        values: "41x30"
    alert_rule_test:
      - eval_time: 90m
        alertname: TrueNASDiskMissing
        exp_alerts: []

  # A disk skips a few samples while the others keep reporting: no alert.
  - name: short gap on one disk
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40x30 _x8 40x60"
      - series: '{__name__="truenas.nas.truenas_disk_temp.diskb.temp"}'
        values: "41x120"
    alert_rule_test:
      - eval_time: 36m
        alertname: TrueNASDiskMissing
        exp_alerts: []
      - eval_time: 60m
        alertname: TrueNASDiskMissing
        exp_alerts: []

  # A hot disk keeps alerting through a short gap in its samples.
  - name: hot disk through a short gap
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "55x20 _x3 55x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts: []
      - eval_time: 45m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              disk: diska
            exp_annotations:
              summary: "TrueNAS disk diska is running hot"
              description: "Disk diska has been at 55°C or more for 15 minutes (warning threshold 50°C). Check the fans and airflow in the NAS."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  - name: critical disk through a short gap
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "65x5 _x2 65x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: TrueNASDiskTemperatureCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              disk: diska
            exp_annotations:
              summary: "TrueNAS disk diska is overheating"
              description: "Disk diska is at 65°C, at or above the 60°C critical threshold, for 5 minutes. Sustained heat shortens drive life and can cause failures."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # A link that goes down alerts even if its samples have gaps.
  - name: link down through a short gap
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.net_carrier.enp1s0.up"}'
        values: "1x20 0x4 _x2 0x20"
    alert_rule_test:
      - eval_time: 40m
        alertname: TrueNASNetworkLinkDown
        exp_alerts:
          - exp_labels:
              severity: warning
              iface: enp1s0
            exp_annotations:
              summary: "TrueNAS network link enp1s0 is down"
              description: "Interface enp1s0 on the NAS has had no carrier for 5 minutes, after being up in the last 7 days. Check the cable, the switch port and the NIC."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # Disk temperatures lag 15 to 20 minutes, with the odd 10 minute hole on top.
  # The newest sample is 25 to 40 minutes old here (the series ends at minute
  # 30, a sample every 5 minutes) and the collector is still working: the
  # missing-metrics alert stays quiet. The old 5 minute lookback fired here.
  - name: lagging disk temperatures do not alert
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x200"
    alert_rule_test:
      - eval_time: 50m
        alertname: TrueNASDiskTemperatureMetricsMissing
        exp_alerts: []
      - eval_time: 65m
        alertname: TrueNASDiskTemperatureMetricsMissing
        exp_alerts: []

  # The collector stops for good: no sample for 45 minutes while the host keeps
  # reporting, so the alert fires.
  - name: disk temperature collector stops
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x200"
    alert_rule_test:
      - eval_time: 100m
        alertname: TrueNASDiskTemperatureMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "TrueNAS disk temperatures are not being reported"
              description: "TrueNAS is reporting metrics, but no disk temperature series has arrived for 45 minutes, when a working collector is at most 20 minutes behind. The disk temperature alerts cannot fire."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The host is gone too: TrueNASMetricsMissing owns that, not this alert.
  - name: whole host gone is not a collector problem
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40 _x4 40 _x4 40 _x4 40"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 100m
        alertname: TrueNASDiskTemperatureMetricsMissing
        exp_alerts: []

  # A hot disk alerts although its newest sample is 15 to 20 minutes old: the
  # last sample is at minute 60 and the alert is still up at minute 76.
  - name: hot disk with lagging samples
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55 _x4 55"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts: []
      - eval_time: 76m
        alertname: TrueNASDiskTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              disk: diska
            exp_annotations:
              summary: "TrueNAS disk diska is running hot"
              description: "Disk diska has been at 55°C or more for 15 minutes (warning threshold 50°C). Check the fans and airflow in the NAS."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # One disk is 40 minutes behind the others, within what a lagging collector
  # does: the per-disk alert stays quiet until it is 45 minutes behind.
  - name: disk a little behind the others does not alert
    interval: 1m
    input_series:
      - series: '{__name__="truenas.nas.truenas_disk_temp.diska.temp"}'
        values: "40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40 _x4 40"
      - series: '{__name__="truenas.nas.truenas_disk_temp.diskb.temp"}'
        values: "41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41 _x4 41"
    alert_rule_test:
      - eval_time: 70m
        alertname: TrueNASDiskMissing
        exp_alerts: []
