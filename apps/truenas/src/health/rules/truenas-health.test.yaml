# Unit tests for deployments/production/alerting/truenas-health-vmrules.yaml.
# Run with test-rules.sh. The series are what truenas-health.py pushes every
# minute for a healthy NAS and for each failure the rules must catch, so a rule
# change that stops an alert from firing, or makes it fire on a healthy NAS,
# fails here instead of on the real pool.
#
# time() in a vmalert-tool test starts at 2000-01-01T00:00:00Z (946684800), so
# a scrub that finished 11.6 days before the start is 946684800 - 1000000 =
# 945684800, and one that finished 46.3 days before is 946684800 - 4000000 =
# 942684800.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # A healthy NAS: nothing fires.
  - name: healthy NAS
    interval: 1m
    input_series:
      - series: "truenas_health_push_timestamp_seconds"
        values: "1x180"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x180"
      - series: 'truenas_health_collect_ok{source="pool"}'
        values: "1x180"
      - series: 'truenas_smart_collect_ok{disk="sda",serial="SERIAL-SDA"}'
        values: "1x180"
      - series: 'truenas_pool_state{pool="tank",state="ONLINE"}'
        values: "1x180"
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="RAIDZ3",vdev="raidz3-0",state="ONLINE"}'
        values: "1x180"
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="DISK",vdev="uuid-a",parent="raidz3-0",disk="sda",serial="SERIAL-SDA",state="ONLINE"}'
        values: "1x180"
      # A hot spare that is available is not a problem.
      - series: 'truenas_pool_vdev_state{pool="tank",class="spare",type="DISK",vdev="uuid-s",disk="sdm",serial="SERIAL-SDM",state="AVAIL"}'
        values: "1x180"
      - series: 'truenas_pool_vdev_errors{pool="tank",class="data",type="DISK",vdev="uuid-a",parent="raidz3-0",disk="sda",serial="SERIAL-SDA",kind="checksum"}'
        values: "0x180"
      - series: 'truenas_pool_last_scan_errors{pool="tank",function="SCRUB"}'
        values: "0x180"
      - series: 'truenas_pool_last_scan_end_timestamp_seconds{pool="tank",function="SCRUB"}'
        values: "945684800x180"
      - series: 'truenas_pool_scan_in_progress{pool="tank"}'
        values: "0x180"
      - series: 'truenas_smart_healthy{disk="sda",serial="SERIAL-SDA"}'
        values: "1x180"
      - series: 'truenas_smart_selftest_failed{disk="sda",serial="SERIAL-SDA"}'
        values: "0x180"
      # A count that was already there is not "increasing".
      - series: 'truenas_smart_reallocated_sectors{disk="sda",serial="SERIAL-SDA"}'
        values: "16x180"
      - series: 'truenas_smart_pending_sectors{disk="sda",serial="SERIAL-SDA"}'
        values: "0x180"
      - series: 'truenas_smart_offline_uncorrectable_sectors{disk="sda",serial="SERIAL-SDA"}'
        values: "0x180"
      - series: 'truenas_smart_reported_uncorrectable_errors{disk="sda",serial="SERIAL-SDA"}'
        values: "0x180"
      - series: 'truenas_smart_nvme_critical_warning{disk="nvme0n1",serial="SERIAL-NVME"}'
        values: "0x180"
      - series: 'truenas_smart_nvme_media_errors{disk="nvme0n1",serial="SERIAL-NVME"}'
        values: "0x180"
    alert_rule_test:
      - {
          eval_time: 170m,
          alertname: TrueNASHealthMetricsMissing,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASHealthSourceFailing,
          exp_alerts: [],
        }
      - { eval_time: 170m, alertname: TrueNASSmartReadFailing, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASPoolNotOnline, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASVdevNotOnline, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASVdevErrors, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASPoolScanErrors, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASScrubOverdue, exp_alerts: [] }
      - { eval_time: 170m, alertname: TrueNASSmartHealthFailed, exp_alerts: [] }
      - {
          eval_time: 170m,
          alertname: TrueNASSmartSelfTestFailed,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASSmartReallocatedSectorsIncreasing,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASSmartPendingSectors,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASSmartUncorrectableErrors,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASNvmeCriticalWarning,
          exp_alerts: [],
        }
      - {
          eval_time: 170m,
          alertname: TrueNASNvmeMediaErrorsIncreasing,
          exp_alerts: [],
        }

  # A degraded pool: one disk FAULTED and one REMOVED in a RAIDZ vdev. The
  # pushes must say the pool, the vdev and each disk by serial.
  - name: degraded RAIDZ pool
    interval: 1m
    input_series:
      - series: 'truenas_pool_state{pool="tank",state="DEGRADED"}'
        values: "1x30"
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="RAIDZ3",vdev="raidz3-0",state="DEGRADED"}'
        values: "1x30"
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="DISK",vdev="uuid-a",parent="raidz3-0",disk="sda",serial="SERIAL-SDA",state="FAULTED"}'
        values: "1x30"
      # A removed disk is no longer in the system, so it has no kernel name.
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="DISK",vdev="uuid-b",parent="raidz3-0",serial="SERIAL-SDB",state="REMOVED"}'
        values: "1x30"
      - series: 'truenas_pool_vdev_state{pool="tank",class="data",type="DISK",vdev="uuid-c",parent="raidz3-0",disk="sdc",serial="SERIAL-SDC",state="ONLINE"}'
        values: "1x30"
      - series: 'truenas_pool_vdev_state{pool="fast",class="data",type="MIRROR",vdev="mirror-0",state="ONLINE"}'
        values: "1x30"
      - series: 'truenas_pool_state{pool="fast",state="ONLINE"}'
        values: "1x30"
      - series: 'truenas_pool_vdev_errors{pool="tank",class="data",type="DISK",vdev="uuid-a",parent="raidz3-0",disk="sda",serial="SERIAL-SDA",kind="checksum"}'
        values: "47x30"
      - series: 'truenas_pool_vdev_errors{pool="tank",class="data",type="DISK",vdev="uuid-c",parent="raidz3-0",disk="sdc",serial="SERIAL-SDC",kind="read"}'
        values: "0x30"
    alert_rule_test:
      # Not yet: the rules wait 2 minutes so a blip does not page.
      - { eval_time: 1m, alertname: TrueNASPoolNotOnline, exp_alerts: [] }
      - eval_time: 10m
        alertname: TrueNASPoolNotOnline
        exp_alerts:
          - exp_labels: { severity: critical, pool: tank, state: DEGRADED }
            exp_annotations:
              summary: "TrueNAS pool tank is DEGRADED"
              description: "Pool tank reports DEGRADED. ZFS keeps serving data while it can, but redundancy is reduced or gone, and another failure could lose data. The vdev and disk alerts say which one is affected; `zpool status tank` on the NAS shows the detail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 10m
        alertname: TrueNASVdevNotOnline
        exp_alerts:
          - exp_labels:
              {
                severity: critical,
                pool: tank,
                class: data,
                type: RAIDZ3,
                vdev: raidz3-0,
                state: DEGRADED,
              }
            exp_annotations:
              summary: "TrueNAS RAIDZ3 vdev raidz3-0 in pool tank is DEGRADED"
              description: "RAIDZ3 vdev raidz3-0 of pool tank has been DEGRADED for 2 minutes. The pool is running with less redundancy, or none. Replace or reseat the disk in the TrueNAS UI (Storage, Manage Devices)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
          - exp_labels:
              {
                severity: critical,
                pool: tank,
                class: data,
                type: DISK,
                vdev: uuid-a,
                parent: raidz3-0,
                disk: sda,
                serial: SERIAL-SDA,
                state: FAULTED,
              }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDA (sda) in pool tank is FAULTED"
              description: "Disk SERIAL-SDA (sda) in raidz3-0 of pool tank has been FAULTED for 2 minutes. The pool is running with less redundancy, or none. Replace or reseat the disk in the TrueNAS UI (Storage, Manage Devices)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
          - exp_labels:
              {
                severity: critical,
                pool: tank,
                class: data,
                type: DISK,
                vdev: uuid-b,
                parent: raidz3-0,
                serial: SERIAL-SDB,
                state: REMOVED,
              }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB in pool tank is REMOVED"
              description: "Disk SERIAL-SDB in raidz3-0 of pool tank has been REMOVED for 2 minutes. The pool is running with less redundancy, or none. Replace or reseat the disk in the TrueNAS UI (Storage, Manage Devices)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 10m
        alertname: TrueNASVdevErrors
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                pool: tank,
                class: data,
                type: DISK,
                vdev: uuid-a,
                parent: raidz3-0,
                disk: sda,
                serial: SERIAL-SDA,
                kind: checksum,
              }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDA (sda) in pool tank has checksum errors"
              description: "ZFS counted 47 checksum errors on disk SERIAL-SDA (sda) of pool tank. A disk that keeps producing them is failing, a bad cable or controller port can too. Check SMART for the disk and clear the counters with `zpool clear` once the cause is fixed."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The pool comes back: the DEGRADED series stops and an ONLINE one starts,
  # and the alert resolves instead of lingering on the old state.
  - name: pool recovers
    interval: 1m
    input_series:
      - series: 'truenas_pool_state{pool="tank",state="DEGRADED"}'
        values: "1x10 _x40"
      - series: 'truenas_pool_state{pool="tank",state="ONLINE"}'
        values: "_x10 1x40"
    alert_rule_test:
      - eval_time: 9m
        alertname: TrueNASPoolNotOnline
        exp_alerts:
          - exp_labels: { severity: critical, pool: tank, state: DEGRADED }
            exp_annotations:
              summary: "TrueNAS pool tank is DEGRADED"
              description: "Pool tank reports DEGRADED. ZFS keeps serving data while it can, but redundancy is reduced or gone, and another failure could lose data. The vdev and disk alerts say which one is affected; `zpool status tank` on the NAS shows the detail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - { eval_time: 30m, alertname: TrueNASPoolNotOnline, exp_alerts: [] }

  # Scrubs: errors in the last one, and scrubbing that stopped.
  - name: scrub errors and overdue scrub
    interval: 1m
    input_series:
      - series: 'truenas_pool_last_scan_errors{pool="tank",function="SCRUB"}'
        values: "3x180"
      - series: 'truenas_pool_last_scan_end_timestamp_seconds{pool="tank",function="SCRUB"}'
        values: "942684800x180"
      # Scrubbed 11.6 days before the start: fine.
      - series: 'truenas_pool_last_scan_end_timestamp_seconds{pool="fast",function="SCRUB"}'
        values: "945684800x180"
      # Overdue, but a scrub is running right now, so the last-scan series is gone.
      - series: 'truenas_pool_last_scan_end_timestamp_seconds{pool="boot-pool",function="SCRUB"}'
        values: "942684800x30 _x150"
      - series: 'truenas_pool_scan_in_progress{pool="boot-pool"}'
        values: "0x30 1x150"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASPoolScanErrors
        exp_alerts:
          - exp_labels: { severity: warning, pool: tank, function: SCRUB }
            exp_annotations:
              summary: "TrueNAS pool tank found errors in its last scrub"
              description: "The last scrub of pool tank finished with 3 errors. Check `zpool status -v tank` for the files and devices involved."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      # Overdue for an hour before it alerts. The boot pool is just as overdue,
      # but it is scrubbing now, so it stays quiet.
      - { eval_time: 30m, alertname: TrueNASScrubOverdue, exp_alerts: [] }
      - eval_time: 120m
        alertname: TrueNASScrubOverdue
        exp_alerts:
          - exp_labels: { severity: warning, pool: tank }
            exp_annotations:
              summary: "TrueNAS pool tank has not been scrubbed for 46d 9h 6m 40s"
              description: "The last scrub or resilver of pool tank finished 46d 9h 6m 40s ago, more than the 45 days the scrub schedule allows. Check Data Protection, Scrub Tasks in the TrueNAS UI."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # A failing disk, as smartctl reports it.
  - name: failing disk
    interval: 1m
    input_series:
      - series: 'truenas_smart_healthy{disk="sdb",serial="SERIAL-SDB"}'
        values: "0x120"
      - series: 'truenas_smart_selftest_failed{disk="sdb",serial="SERIAL-SDB"}'
        values: "1x120"
      # Reallocated sectors go from 0 to 16 on the 10th minute.
      - series: 'truenas_smart_reallocated_sectors{disk="sdb",serial="SERIAL-SDB"}'
        values: "0x9 16x110"
      - series: 'truenas_smart_pending_sectors{disk="sdb",serial="SERIAL-SDB"}'
        values: "8x120"
      - series: 'truenas_smart_offline_uncorrectable_sectors{disk="sdb",serial="SERIAL-SDB"}'
        values: "2x120"
      - series: 'truenas_smart_reported_uncorrectable_errors{disk="sdc",serial="SERIAL-SDC"}'
        values: "1x120"
      # The same counters on a healthy disk stay at zero.
      - series: 'truenas_smart_pending_sectors{disk="sda",serial="SERIAL-SDA"}'
        values: "0x120"
      - series: 'truenas_smart_healthy{disk="sda",serial="SERIAL-SDA"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASSmartHealthFailed
        exp_alerts:
          - exp_labels: { severity: critical, disk: sdb, serial: SERIAL-SDB }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) failed its SMART health check"
              description: "Disk SERIAL-SDB (sdb) has reported a failed SMART overall health assessment for 5 minutes. It is predicting its own failure. Replace it, and check the pool in the TrueNAS UI."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 10m
        alertname: TrueNASSmartSelfTestFailed
        exp_alerts:
          - exp_labels: { severity: warning, disk: sdb, serial: SERIAL-SDB }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) failed its last SMART self-test"
              description: "The most recent SMART self-test of disk SERIAL-SDB (sdb) did not pass. Look at the self-test log with `smartctl -l selftest /dev/sdb` and replace the disk if the failure is a read error."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 20m
        alertname: TrueNASSmartReallocatedSectorsIncreasing
        exp_alerts:
          - exp_labels: { severity: warning, disk: sdb, serial: SERIAL-SDB }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) is reallocating sectors"
              description: "Disk SERIAL-SDB (sdb) remapped bad sectors in the last 7 days (reallocated count up by 16). A disk whose count keeps growing is wearing out; plan to replace it."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      # Pending sectors wait an hour, since a rewrite clears them.
      - {
          eval_time: 30m,
          alertname: TrueNASSmartPendingSectors,
          exp_alerts: [],
        }
      - eval_time: 90m
        alertname: TrueNASSmartPendingSectors
        exp_alerts:
          - exp_labels: { severity: warning, disk: sdb, serial: SERIAL-SDB }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) has pending sectors"
              description: "Disk SERIAL-SDB (sdb) has had unreadable sectors pending reallocation for over an hour (count 8). A scrub or a disk replacement will resolve it; if the count grows, the disk is failing."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 90m
        alertname: TrueNASSmartUncorrectableErrors
        exp_alerts:
          - exp_labels:
              {
                severity: warning,
                disk: sdb,
                serial: SERIAL-SDB,
                kind: offline uncorrectable sectors,
              }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) reports uncorrectable errors"
              description: "Disk SERIAL-SDB (sdb) has had a nonzero offline uncorrectable sectors count for over an hour (2). It could not read data it should have, and is likely to fail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
          - exp_labels:
              {
                severity: warning,
                disk: sdc,
                serial: SERIAL-SDC,
                kind: reported uncorrectable errors,
              }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDC (sdc) reports uncorrectable errors"
              description: "Disk SERIAL-SDC (sdc) has had a nonzero reported uncorrectable errors count for over an hour (1). It could not read data it should have, and is likely to fail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # An NVMe disk with a critical warning flag and media errors.
  - name: failing NVMe disk
    interval: 1m
    input_series:
      - series: 'truenas_smart_nvme_critical_warning{disk="nvme0n1",serial="SERIAL-NVME"}'
        values: "4x30"
      - series: 'truenas_smart_nvme_media_errors{disk="nvme0n1",serial="SERIAL-NVME"}'
        values: "0x9 5x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASNvmeCriticalWarning
        exp_alerts:
          - exp_labels:
              { severity: critical, disk: nvme0n1, serial: SERIAL-NVME }
            exp_annotations:
              summary: "TrueNAS NVMe disk SERIAL-NVME (nvme0n1) raised a critical warning"
              description: "NVMe disk SERIAL-NVME (nvme0n1) reports critical warning flags 4 (bit field: 1 spare capacity low, 2 temperature, 4 reliability degraded, 8 read-only, 16 volatile memory backup failed). Run `smartctl -a /dev/nvme0n1` on the NAS for the detail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 20m
        alertname: TrueNASNvmeMediaErrorsIncreasing
        exp_alerts:
          - exp_labels:
              { severity: warning, disk: nvme0n1, serial: SERIAL-NVME }
            exp_annotations:
              summary: "TrueNAS NVMe disk SERIAL-NVME (nvme0n1) is logging media errors"
              description: "NVMe disk SERIAL-NVME (nvme0n1) logged 5 more media and data integrity errors in the last 7 days."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The health job stopped while the host keeps reporting: the pool alerts
  # cannot see anything, so this must fire.
  - name: health job stopped
    interval: 1m
    input_series:
      - series: "truenas_health_push_timestamp_seconds"
        values: "1x20 _x100"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x120"
    alert_rule_test:
      - {
          eval_time: 20m,
          alertname: TrueNASHealthMetricsMissing,
          exp_alerts: [],
        }
      - eval_time: 60m
        alertname: TrueNASHealthMetricsMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "TrueNAS pool and disk health is not being reported"
              description: "TrueNAS is reporting performance metrics, but its health cron job has not pushed for 15 minutes. A degraded pool or a failing disk would go unnoticed. Check that the 'Report ZFS pool and SMART health' cron job exists and is enabled in the TrueNAS UI (System, Advanced Settings, Cron Jobs), run it by hand, and run `nx run truenas:deploy` to put it back."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The whole host is down: TrueNASMetricsMissing covers it, so the health
  # alert stays quiet rather than adding a second push.
  - name: host down
    interval: 1m
    input_series:
      - series: "truenas_health_push_timestamp_seconds"
        values: "1x20 _x100"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x20 _x100"
    alert_rule_test:
      - {
          eval_time: 60m,
          alertname: TrueNASHealthMetricsMissing,
          exp_alerts: [],
        }

  # A source the job cannot read, and a disk smartctl cannot read.
  - name: collection failures
    interval: 1m
    input_series:
      - series: 'truenas_health_collect_ok{source="pool"}'
        values: "0x30"
      - series: 'truenas_health_collect_ok{source="disks"}'
        values: "1x30"
      - series: 'truenas_smart_collect_ok{disk="sdh",serial="SERIAL-SDH"}'
        values: "0x30"
      - series: 'truenas_smart_collect_ok{disk="sda",serial="SERIAL-SDA"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: TrueNASHealthSourceFailing
        exp_alerts:
          - exp_labels: { severity: warning, source: pool }
            exp_annotations:
              summary: "TrueNAS health cron job cannot read pool"
              description: "The health cron job could not read 'pool' from the TrueNAS middleware for 10 minutes, so the pool or disk alerts that depend on it cannot fire. This usually follows a TrueNAS upgrade that changed the middleware's output. Run the script by hand to see the error (see the apps/truenas README)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 20m
        alertname: TrueNASSmartReadFailing
        exp_alerts:
          - exp_labels: { severity: warning, disk: sdh, serial: SERIAL-SDH }
            exp_annotations:
              summary: "TrueNAS cannot read SMART from disk SERIAL-SDH (sdh)"
              description: "smartctl could not read disk SERIAL-SDH (sdh) for 10 minutes, so the SMART alerts cannot see it. The disk may have failed or dropped off its controller. Check the pool in the TrueNAS UI."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # The documented way to prove the alert path on the real cluster without
  # touching the real pool: push one fake DEGRADED pool sample by hand. A single
  # sample stays visible long enough for the 2 minute wait, fires, and then goes
  # stale and resolves by itself.
  - name: one pushed sample for a fake pool
    interval: 1m
    input_series:
      - series: 'truenas_pool_state{pool="alert-test",state="DEGRADED"}'
        values: "1 _x30"
    alert_rule_test:
      - eval_time: 4m
        alertname: TrueNASPoolNotOnline
        exp_alerts:
          - exp_labels:
              { severity: critical, pool: alert-test, state: DEGRADED }
            exp_annotations:
              summary: "TrueNAS pool alert-test is DEGRADED"
              description: "Pool alert-test reports DEGRADED. ZFS keeps serving data while it can, but redundancy is reduced or gone, and another failure could lose data. The vdev and disk alerts say which one is affected; `zpool status alert-test` on the NAS shows the detail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - { eval_time: 15m, alertname: TrueNASPoolNotOnline, exp_alerts: [] }

  # The job runs on a schedule and a run can be missed or late. A gap between
  # pushes must neither mute an alert that is firing nor start one.
  - name: gaps between pushes do not mute a firing alert
    interval: 1m
    input_series:
      # One push every 4 minutes: three empty minutes between samples.
      - series: 'truenas_pool_state{pool="tank",state="DEGRADED"}'
        values: "1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3 1 _x3"
      - series: 'truenas_smart_healthy{disk="sdb",serial="SERIAL-SDB"}'
        values: "0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3"
    alert_rule_test:
      # Evaluated in the middle of a gap, after the wait has passed.
      - eval_time: 30m
        alertname: TrueNASPoolNotOnline
        exp_alerts:
          - exp_labels: { severity: critical, pool: tank, state: DEGRADED }
            exp_annotations:
              summary: "TrueNAS pool tank is DEGRADED"
              description: "Pool tank reports DEGRADED. ZFS keeps serving data while it can, but redundancy is reduced or gone, and another failure could lose data. The vdev and disk alerts say which one is affected; `zpool status tank` on the NAS shows the detail."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      - eval_time: 30m
        alertname: TrueNASSmartHealthFailed
        exp_alerts:
          - exp_labels: { severity: critical, disk: sdb, serial: SERIAL-SDB }
            exp_annotations:
              summary: "TrueNAS disk SERIAL-SDB (sdb) failed its SMART health check"
              description: "Disk SERIAL-SDB (sdb) has reported a failed SMART overall health assessment for 5 minutes. It is predicting its own failure. Replace it, and check the pool in the TrueNAS UI."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  - name: a missed run does not fire the heartbeat alert
    interval: 1m
    input_series:
      # Pushes every minute, then 4 minutes with none, then every minute again.
      - series: "truenas_health_push_timestamp_seconds"
        values: "1x10 _x4 1x40"
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1x60"
    alert_rule_test:
      - {
          eval_time: 14m,
          alertname: TrueNASHealthMetricsMissing,
          exp_alerts: [],
        }
      - {
          eval_time: 30m,
          alertname: TrueNASHealthMetricsMissing,
          exp_alerts: [],
        }

  # The Graphite exporter pushes with multi-minute gaps. A gap in the uptime
  # series must not read as "the host is down" and mute the heartbeat alert.
  - name: gaps in the host uptime do not mute the heartbeat alert
    interval: 1m
    input_series:
      - series: "truenas_health_push_timestamp_seconds"
        values: "1x10 _x110"
      # One sample every 6 minutes.
      - series: '{__name__="truenas.nas.system.uptime.uptime"}'
        values: "1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5 1 _x5"
    alert_rule_test:
      - eval_time: 60m
        alertname: TrueNASHealthMetricsMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "TrueNAS pool and disk health is not being reported"
              description: "TrueNAS is reporting performance metrics, but its health cron job has not pushed for 15 minutes. A degraded pool or a failing disk would go unnoticed. Check that the 'Report ZFS pool and SMART health' cron job exists and is enabled in the TrueNAS UI (System, Advanced Settings, Cron Jobs), run it by hand, and run `nx run truenas:deploy` to put it back."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  # Scheduled tasks. time() starts at 946684800, so 946684000 is 800 s before
  # the test starts, 946683000 is 1800 s before, and 946600000 is a day or so
  # before that.
  - name: tasks that succeeded and ran on schedule fire nothing
    interval: 1m
    input_series:
      - series: 'truenas_task_enabled{type="cloudsync",task="Photos",id="1"}'
        values: "1x60"
      - series: 'truenas_task_failed{type="cloudsync",task="Photos",id="1"}'
        values: "0x60"
      - series: 'truenas_task_running{type="cloudsync",task="Photos",id="1"}'
        values: "0x60"
      # started after it was due
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946683000x60"
      - series: 'truenas_task_last_run_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946683030x60"
      # never ran, so there is nothing to compare: left to the dashboard
      - series: 'truenas_task_enabled{type="snapshot",task="tank/media",id="21"}'
        values: "1x60"
      - series: 'truenas_task_failed{type="snapshot",task="tank/media",id="21"}'
        values: "0x60"
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="snapshot",task="tank/media",id="21"}'
        values: "946683000x60"
    alert_rule_test:
      - { eval_time: 50m, alertname: TrueNASTaskFailed, exp_alerts: [] }
      - { eval_time: 50m, alertname: TrueNASTaskOverdue, exp_alerts: [] }

  - name: a failed task alerts until it succeeds, and a disabled one does not
    interval: 1m
    input_series:
      - series: 'truenas_task_enabled{type="cloudsync",task="Documents",id="2"}'
        values: "1x60"
      - series: 'truenas_task_failed{type="cloudsync",task="Documents",id="2"}'
        values: "0x5 1x20 0x35"
      - series: 'truenas_task_enabled{type="replication",task="tank to backup",id="10"}'
        values: "0x60"
      - series: 'truenas_task_failed{type="replication",task="tank to backup",id="10"}'
        values: "1x60"
    alert_rule_test:
      # failed at minute 5, so not yet at 9 minutes (for: 5m)
      - { eval_time: 9m, alertname: TrueNASTaskFailed, exp_alerts: [] }
      - eval_time: 15m
        alertname: TrueNASTaskFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              type: cloudsync
              task: Documents
              id: "2"
            exp_annotations:
              summary: "TrueNAS cloudsync task Documents failed"
              description: "The last run of the cloudsync task 'Documents' (id 2) failed. Open Data Protection in the TrueNAS UI for the error, and the TrueNAS dashboard for the history of every task."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
      # it succeeded at minute 25, and the 5 minute window drains by minute 31
      - { eval_time: 45m, alertname: TrueNASTaskFailed, exp_alerts: [] }

  - name: a task that missed its schedule alerts, unless it is running or still in its grace period
    interval: 1m
    input_series:
      # due 30 minutes before the test started, last started a day earlier
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946683000x60"
      - series: 'truenas_task_last_run_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946600000x60"
      - series: 'truenas_task_running{type="cloudsync",task="Photos",id="1"}'
        values: "0x60"
      # missed too, but it is running now: not overdue
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="rsync",task="/mnt/tank/share",id="30"}'
        values: "946683000x60"
      - series: 'truenas_task_last_run_timestamp_seconds{type="rsync",task="/mnt/tank/share",id="30"}'
        values: "946600000x60"
      - series: 'truenas_task_running{type="rsync",task="/mnt/tank/share",id="30"}'
        values: "1x60"
      # due 60 seconds before the test started: inside the 15 minute grace
      # period at minute 10 (660 s)
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="snapshot",task="tank/data",id="20"}'
        values: "946684740x60"
      - series: 'truenas_task_last_run_timestamp_seconds{type="snapshot",task="tank/data",id="20"}'
        values: "946600000x60"
      - series: 'truenas_task_running{type="snapshot",task="tank/data",id="20"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 10m
        alertname: TrueNASTaskOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              type: cloudsync
              task: Photos
              id: "1"
            exp_annotations:
              summary: "TrueNAS cloudsync task Photos did not run on schedule"
              description: "The cloudsync task 'Photos' (id 1) should have started 40m 0s ago and has not. Check that the task is enabled and that TrueNAS was up at the scheduled time (Data Protection in the TrueNAS UI)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS

  - name: a task that runs again after being overdue stops alerting
    interval: 1m
    input_series:
      - series: 'truenas_task_last_scheduled_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946683000x60"
      # started at minute 20 (946684800 + 1200)
      - series: 'truenas_task_last_run_timestamp_seconds{type="cloudsync",task="Photos",id="1"}'
        values: "946600000x20 946686000x40"
      - series: 'truenas_task_running{type="cloudsync",task="Photos",id="1"}'
        values: "0x60"
    alert_rule_test:
      - { eval_time: 45m, alertname: TrueNASTaskOverdue, exp_alerts: [] }

  - name: a task source that cannot be read raises the existing source alert
    interval: 1m
    input_series:
      - series: 'truenas_health_collect_ok{source="tasks_cloudsync"}'
        values: "0x60"
      - series: 'truenas_health_collect_ok{source="job_history"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: TrueNASHealthSourceFailing
        exp_alerts:
          - exp_labels: { severity: warning, source: tasks_cloudsync }
            exp_annotations:
              summary: "TrueNAS health cron job cannot read tasks_cloudsync"
              description: "The health cron job could not read 'tasks_cloudsync' from the TrueNAS middleware for 10 minutes, so the pool or disk alerts that depend on it cannot fire. This usually follows a TrueNAS upgrade that changed the middleware's output. Run the script by hand to see the error (see the apps/truenas README)."
              dashboard_url: https://grafana.smith-simms.family/dashboards?query=TrueNAS
