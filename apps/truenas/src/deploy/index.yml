---
- name: Configure TrueNAS to report to the cluster
  hosts: all
  become: no
  gather_facts: no
  connection: ssh
  vars:
    # Where VictoriaMetrics (Graphite) and VictoriaLogs (syslog) are published
    # on the Kubernetes node. observability_host is passed in by
    # scripts/deploy.ts.
    observability_graphite_port: 30003
    observability_syslog_port: 30514
    observability_exporter_name: victoriametrics
    observability_graphite_prefix: truenas
    observability_graphite_namespace: nas
    # VictoriaMetrics' HTTP ingestion door on the same node (the vmsingle
    # NodePort Service in deployments/base/metrics), which the health cron job
    # pushes to. See tasks/health.yml.
    health_import_port: 30080
    health_cron_description: Report ZFS pool and SMART health to VictoriaMetrics
    health_cron_schedule:
      minute: "*"
      hour: "*"
      dom: "*"
      month: "*"
      dow: "*"
    health_script: "{{ playbook_dir }}/../health/truenas-health.py"

  tasks:
    - name: Observability (metrics exporter and remote syslog)
      ansible.builtin.import_tasks: tasks/observability.yml
      tags: [observability]

    - name: Health reporting (ZFS pool, vdev and SMART metrics)
      ansible.builtin.import_tasks: tasks/health.yml
      tags: [health]
