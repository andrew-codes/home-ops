---
# Read-only. Prints dns.hosts on each Pi-hole and fails when the two differ.
- hosts: all
  become: yes
  become_method: ansible.builtin.sudo
  become_user: root
  gather_facts: no
  connection: ssh
  remote_user: root

  vars:
    # Pi-hole v6 prints arrays as `[ ip host, ip host ]` with unquoted entries
    # (not JSON), or quoted when set that way. Extract every "<ipv4> <hostname>"
    # pair instead of parsing the brackets. Keep in sync with parseDnsHosts in
    # src/dns-hosts.ts.
    dns_host_pattern: '\d{1,3}(?:\.\d{1,3}){3}\s+[\w.-]+'

  tasks:
    - name: Read dns.hosts
      ansible.builtin.shell: pihole-FTL --config dns.hosts
      register: current_dns_hosts
      changed_when: false

    - name: Show dns.hosts
      ansible.builtin.debug:
        msg: "{{ current_dns_hosts.stdout | regex_findall(dns_host_pattern) | sort }}"

    - name: Compare dns.hosts across instances
      run_once: true
      ansible.builtin.assert:
        that:
          - >-
            ansible_play_hosts_all
            | map('extract', hostvars, ['current_dns_hosts', 'stdout'])
            | map('regex_findall', dns_host_pattern) | map('sort') | map('join', ',')
            | unique | length == 1
        success_msg: "dns.hosts is identical on both Pi-holes"
        fail_msg: "dns.hosts differs between the Pi-holes"
