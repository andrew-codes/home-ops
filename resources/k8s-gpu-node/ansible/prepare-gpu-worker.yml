---
- name: Prepare Ubuntu 24.04 GPU worker node
  hosts: all
  become: true
  gather_facts: true

  vars:
    kube_version: "1.32.2"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  tasks:
    - name: Install base packages
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - lsb-release
          - apt-transport-https
          - software-properties-common
          - nfs-common
        state: present

    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*\sswap\s.*)$'
        replace: '#\1'

    - name: Load required kernel modules
      copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter
      notify: ["reload sysctl"]

    - name: Set sysctl params for Kubernetes
      copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.ipv4.ip_forward                 = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: ["reload sysctl"]

    - name: Install containerd
      apt:
        name: containerd
        state: present

    - name: Configure containerd
      shell: |
        mkdir -p /etc/containerd
        containerd config default | tee /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Restart and enable containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: Ensure Kubernetes apt keyring present
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repo (apt_repository with retries)
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kube_version }}/deb/ /"
        filename: kubernetes
        state: present
      register: add_k8s_repo
      retries: 5
      delay: 5
      until: add_k8s_repo is succeeded

    - name: Update apt cache (kubernetes)
      apt:
        update_cache: yes

    - name: Install Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold Kubernetes packages
      ansible.builtin.command: "apt-mark hold {{ item }}"
      register: hold_result
      changed_when: "'already' not in hold_result.stdout"
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable GPU on this node (driver, container toolkit, containerd runtime)
      import_tasks: gpu-node-prep.yml

    - name: Join the cluster if join_command provided
      shell: "{{ join_command }}"
      when: join_command is defined and join_command != ""

  handlers:
    - name: reload sysctl
      command: sysctl --system
