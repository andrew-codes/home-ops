---
- name: Enable the passed-through GPU on this node
  hosts: all
  become: true
  become_method: ansible.builtin.sudo
  become_user: root
  gather_facts: true
  connection: ssh
  remote_user: root

  tasks:
    - name: Enable GPU on this node (driver, container toolkit, containerd runtime)
      import_tasks: "{{ playbook_dir }}/gpu-node-prep.yml"
