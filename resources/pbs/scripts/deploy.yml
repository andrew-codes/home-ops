---
- name: Configure Proxmox Backup Server
  hosts: all
  become: yes
  become_method: ansible.builtin.sudo
  become_user: root
  gather_facts: yes
  connection: ssh
  vars:
    # The datastore this playbook adopts. It already exists on the host (it is
    # created by hand, on a local disk) and is never created, recreated or
    # moved here. Any other datastore on the host is left alone.
    pbs_datastore_name: main
    # NUT is opt-in: deploy.ts sets pbs_nut_enabled (and the server and account)
    # only when PBS_ENABLE_NUT=1. See README.md#nut-ups-monitoring.
    pbs_nut_enabled: false
    nut_server_port: 3493
    nut_ups_name: ups
    # Where VictoriaMetrics (InfluxDB write) and VictoriaLogs (syslog) are
    # published on the Kubernetes node. observability_host comes from
    # ansible-secrets.yml (written by deploy.ts).
    observability_influx_port: 30080
    observability_syslog_port: 30514
    observability_metric_server_name: victoriametrics
    observability_influx_organization: proxmox
    observability_influx_bucket: proxmox
  vars_files:
    - ../.secrets/ansible-secrets.yml

  handlers:
    - name: restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted

  tasks:
    - name: Set timezone to Eastern
      community.general.timezone:
        name: America/New_York

    - name: Configure Cloudflare DNS
      copy:
        dest: /etc/resolv.conf
        content: |
          search smith-simms.family
          nameserver 1.1.1.1
          nameserver 1.0.0.1
        owner: root
        group: root
        mode: "0644"

    - name: Set hostname to pbs
      ansible.builtin.hostname:
        name: pbs

    - name: Ensure /etc/hosts resolves the pbs hostname locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1\\s"
        line: "127.0.1.1\tpbs.smith-simms.family pbs"
        state: present

    - name: Install Andrew's SSH public key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ andrew_ssh_public_key }}"

    # The network is not managed here. The host is reached at the address in
    # pbs/ip, which is the address it is already on, and a run must never move
    # it: a wrong address would cut off the SSH connection this play runs on.

    # PBS 4 (Debian trixie) keeps apt sources as deb822 .sources files. The
    # installer writes an enterprise source that needs a subscription and fails
    # apt-get update with a 401, so it is removed (any .list or .sources file
    # that names enterprise.proxmox.com).
    - name: Find PBS enterprise repository sources
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: ["*.list", "*.sources"]
        contains: 'enterprise\.proxmox\.com'
      register: pbs_enterprise_sources

    - name: Remove PBS enterprise repository sources
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pbs_enterprise_sources.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Look for the no-subscription repository under any file name before adding
    # it, so a source the installer or an admin already wrote is not duplicated
    # (apt warns about, and can fail on, the same source in two files).
    - name: Look for an existing PBS no-subscription repository
      ansible.builtin.command: grep -rlE "pbs-no-subscription" /etc/apt/sources.list /etc/apt/sources.list.d
      register: pbs_nosub_sources
      changed_when: false
      failed_when: pbs_nosub_sources.rc > 1

    - name: Add the PBS no-subscription repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pbs-no-subscription.sources
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pbs
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: pbs-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
      when: pbs_nosub_sources.rc != 0

    - name: Update apt cache
      ansible.builtin.command: apt-get update
      changed_when: false

    - name: Check whether Proxmox Backup Server is installed
      ansible.builtin.command: proxmox-backup-manager version
      register: pbs_install_check
      changed_when: false
      failed_when: false

    # The package is not pinned. It is installed only when PBS is absent (a host
    # from the PBS ISO already has it), at whatever the repository currently
    # offers. A running install is never upgraded by this play.
    - name: Install Proxmox Backup Server
      ansible.builtin.apt:
        name: proxmox-backup-server
        state: present
      when: pbs_install_check.rc != 0

    - name: Read the dpkg selection of Proxmox Backup Server
      ansible.builtin.command: dpkg --get-selections proxmox-backup-server
      register: pbs_selection
      changed_when: false
      failed_when: false

    - name: Release any hold on Proxmox Backup Server
      ansible.builtin.dpkg_selections:
        name: proxmox-backup-server
        selection: install
      when: "'hold' in pbs_selection.stdout.split()"

    - name: Install the firewall
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: yes

    # Storage is not managed here: the datastore sits on a local disk of the
    # host (a VM disk backed by the NAS), mounted by the host's own fstab. This
    # play only adopts the existing datastore and never touches a mount, so it
    # cannot start PBS against, or wipe, an empty directory.
    - name: List PBS datastores
      ansible.builtin.command: proxmox-backup-manager datastore list --output-format json
      register: pbs_datastore_list
      changed_when: false

    - name: Find the adopted datastore
      ansible.builtin.set_fact:
        pbs_datastore: >-
          {{ (pbs_datastore_list.stdout | from_json
              | selectattr('name', 'equalto', pbs_datastore_name)
              | list | first) | default({}) }}

    - name: Check that the datastore exists
      ansible.builtin.assert:
        that: pbs_datastore | length > 0
        fail_msg: >-
          Datastore {{ pbs_datastore_name }} does not exist on this host. This play
          adopts an existing datastore and never creates one: create it in the PBS
          UI (Administration, Storage / Disks) or set pbs_datastore_name.
        quiet: true

    - name: List PBS users
      ansible.builtin.command: proxmox-backup-manager user list --output-format json
      register: pbs_user_list
      changed_when: false

    - name: Create PBS backup user
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - user
          - create
          - "{{ pbs_backup_username }}@pbs"
          - --password
          - "{{ pbs_backup_password }}"
      when: pbs_backup_username + '@pbs' not in (pbs_user_list.stdout | from_json | map(attribute='userid') | list)
      no_log: true

    # Everything below reconciles by what exists, never by what this play would
    # have created: an ACL, job or schedule that is already there (whatever its
    # id or value) is kept as it is, so a run never duplicates or overwrites
    # what the host's admin set up.
    - name: List PBS ACLs
      ansible.builtin.command: proxmox-backup-manager acl list --output-format json
      register: pbs_acl_list
      changed_when: false

    - name: Grant PBS backup user DatastoreBackup on the datastore
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - acl
          - update
          - "/datastore/{{ pbs_datastore_name }}"
          - DatastoreBackup
          - --auth-id
          - "{{ pbs_backup_username }}@pbs"
      when: >-
        pbs_acl_list.stdout | from_json
        | selectattr('ugid', 'equalto', pbs_backup_username + '@pbs')
        | selectattr('path', 'equalto', '/datastore/' + pbs_datastore_name)
        | list | length == 0

    - name: List PBS prune jobs
      ansible.builtin.command: proxmox-backup-manager prune-job list --output-format json
      register: pbs_prune_jobs
      changed_when: false

    - name: Create the datastore prune job when it has none
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - prune-job
          - create
          - "prune-{{ pbs_datastore_name }}"
          - --store
          - "{{ pbs_datastore_name }}"
          - --schedule
          - daily
          - --keep-daily
          - "7"
          - --keep-weekly
          - "4"
          - --keep-monthly
          - "3"
      when: >-
        pbs_prune_jobs.stdout | from_json
        | selectattr('store', 'equalto', pbs_datastore_name)
        | list | length == 0

    - name: Set a weekly garbage collection schedule when the datastore has none
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - datastore
          - update
          - "{{ pbs_datastore_name }}"
          - --gc-schedule
          - weekly
      when: pbs_datastore['gc-schedule'] | default('') | length == 0

    - name: List PBS verify jobs
      ansible.builtin.command: proxmox-backup-manager verify-job list --output-format json
      register: pbs_verify_jobs
      changed_when: false

    - name: Create the datastore verify job when it has none
      ansible.builtin.command:
        argv:
          - proxmox-backup-manager
          - verify-job
          - create
          - "verify-{{ pbs_datastore_name }}"
          - --store
          - "{{ pbs_datastore_name }}"
          - --schedule
          - weekly
      when: >-
        pbs_verify_jobs.stdout | from_json
        | selectattr('store', 'equalto', pbs_datastore_name)
        | list | length == 0

    # UPS monitoring is opt-in. It is off unless deploy.ts sets pbs_nut_enabled
    # (PBS_ENABLE_NUT=1), because a client pointed at a server that does not run
    # NUT yet would, at best, never connect, and a wrong MONITOR line can shut
    # this host down. See README.md#nut-ups-monitoring.
    - name: Check that the NUT settings are set when NUT is enabled
      ansible.builtin.assert:
        that:
          - nut_server_host is defined
          - nut_server_host | string | length > 0
          - nut_monitor_username is defined
          - nut_monitor_password is defined
        fail_msg: NUT is enabled but the NUT server address or monitor account is missing.
        quiet: true
      when: pbs_nut_enabled | bool

    - name: Install nut-client (NUT monitoring client only, no local upsd)
      ansible.builtin.apt:
        name: nut-client
        state: present
        update_cache: yes
      when: pbs_nut_enabled | bool

    - name: Configure nut.conf for netclient (network client) mode
      ansible.builtin.copy:
        dest: /etc/nut/nut.conf
        content: |
          MODE=netclient
        owner: root
        group: root
        mode: "0640"
      when: pbs_nut_enabled | bool

    - name: Configure upsmon to monitor the NUT server and shut down on FSD/low battery
      ansible.builtin.copy:
        dest: /etc/nut/upsmon.conf
        content: |
          MONITOR {{ nut_ups_name }}@{{ nut_server_host }}:{{ nut_server_port }} 1 {{ nut_monitor_username }} {{ nut_monitor_password }} secondary
          MINSUPPLIES 1
          SHUTDOWNCMD "/sbin/shutdown -h +0"
          POLLFREQ 5
          POLLFREQALERT 5
          HOSTSYNC 15
          DEADTIME 15
          RBWARNTIME 43200
          NOCOMMWARNTIME 300
          FINALDELAY 5
        owner: root
        group: nut
        mode: "0640"
      no_log: true
      register: pbs_upsmon_config
      when: pbs_nut_enabled | bool

    - name: Ensure the nut-monitor (upsmon) service is enabled and running
      ansible.builtin.systemd:
        name: nut-monitor
        enabled: yes
        state: "{{ 'restarted' if pbs_upsmon_config.changed else 'started' }}"
      when: pbs_nut_enabled | bool

    # NUT off: a host that an earlier run configured must not keep an active
    # MONITOR line (it may point at a server that is gone). The line is removed
    # (not commented out, so its password does not stay in the file) and upsmon
    # is stopped. A host that never had NUT has no file and nothing happens.
    - name: Look for an upsmon configuration
      ansible.builtin.stat:
        path: /etc/nut/upsmon.conf
      register: pbs_upsmon_file
      when: not (pbs_nut_enabled | bool)

    - name: Remove any active MONITOR line from upsmon.conf
      ansible.builtin.lineinfile:
        path: /etc/nut/upsmon.conf
        regexp: '^\s*MONITOR\s'
        state: absent
      register: pbs_upsmon_monitor_removed
      no_log: true
      when:
        - not (pbs_nut_enabled | bool)
        - pbs_upsmon_file.stat.exists

    - name: Stop and disable upsmon after removing its MONITOR line
      ansible.builtin.systemd:
        name: nut-monitor
        enabled: no
        state: stopped
      when:
        - not (pbs_nut_enabled | bool)
        - pbs_upsmon_monitor_removed is changed

    - name: Check that the observability node address is set
      ansible.builtin.assert:
        that:
          - observability_host is defined
          - observability_host | string | length > 0
        fail_msg: observability_host must be the address of the Kubernetes node.
        quiet: true
      tags: [observability]

    - name: Install rsyslog (Proxmox Backup Server logs to journald only by default)
      ansible.builtin.apt:
        name: rsyslog
        state: present
        update_cache: yes
        cache_valid_time: 3600
      tags: [observability]

    # `validate: rsyslogd -N1 -f %s` fails on these hosts with "Permission denied"
    # opening the file in Ansible's temporary directory, and `-f` would only check
    # the fragment without the rest of the config anyway. So
    # the config is installed at its real path, `rsyslogd -N1` checks the whole
    # configuration (/etc/rsyslog.conf plus /etc/rsyslog.d), and a config that
    # fails is rolled back and fails the play. The restart handler only runs at
    # the end of a successful play, so rsyslog never restarts onto a config it
    # cannot load.
    - name: Forward logs to VictoriaLogs
      tags: [observability]
      block:
        - name: Install the VictoriaLogs forwarding config
          ansible.builtin.template:
            src: victorialogs-rsyslog.conf.j2
            dest: /etc/rsyslog.d/90-victorialogs.conf
            owner: root
            group: root
            mode: "0644"
            backup: yes
          register: victorialogs_rsyslog_conf
          notify: restart rsyslog

        - name: Check the full rsyslog configuration loads
          ansible.builtin.command: rsyslogd -N1
          register: victorialogs_rsyslog_check
          changed_when: false
          when: victorialogs_rsyslog_conf is changed
      rescue:
        - name: Restore the previous forwarding config
          ansible.builtin.copy:
            src: "{{ victorialogs_rsyslog_conf.backup_file }}"
            dest: /etc/rsyslog.d/90-victorialogs.conf
            remote_src: yes
            owner: root
            group: root
            mode: "0644"
          when: victorialogs_rsyslog_conf.backup_file | default('') | length > 0

        - name: Remove the new forwarding config when there was no previous one
          ansible.builtin.file:
            path: /etc/rsyslog.d/90-victorialogs.conf
            state: absent
          when:
            - victorialogs_rsyslog_conf is changed
            - victorialogs_rsyslog_conf.backup_file | default('') | length == 0

        - name: Fail because rsyslog cannot load the forwarding config
          ansible.builtin.fail:
            msg: >-
              rsyslogd -N1 rejected the configuration, so the forwarding config
              was rolled back and rsyslog was not restarted:
              {{ victorialogs_rsyslog_check.stderr | default(ansible_failed_result.msg | default('')) }}
      always:
        - name: Remove the forwarding config backup
          ansible.builtin.file:
            path: "{{ victorialogs_rsyslog_conf.backup_file }}"
            state: absent
          when: victorialogs_rsyslog_conf.backup_file | default('') | length > 0

    - name: Ensure rsyslog is enabled and running
      ansible.builtin.systemd:
        name: rsyslog
        enabled: yes
        state: started
      tags: [observability]

    # The PBS metric server API has no dedicated proxmox-backup-manager
    # subcommand, so these tasks call it locally through
    # proxmox-backup-debug. VictoriaMetrics ignores the organization, bucket
    # and token, and the token is optional, so none is set.
    - name: List the InfluxDB HTTP metric servers
      ansible.builtin.command: proxmox-backup-debug api get /config/metrics/influxdb-http --output-format json
      register: pbs_metric_servers
      changed_when: false
      tags: [observability]

    - name: Find the VictoriaMetrics metric server
      ansible.builtin.set_fact:
        pbs_metric_server_current: >-
          {{ (pbs_metric_servers.stdout | from_json
              | selectattr('name', 'equalto', observability_metric_server_name)
              | list | first) | default({}) }}
        pbs_metric_server_url: "http://{{ observability_host }}:{{ observability_influx_port }}"
      tags: [observability]

    - name: Add the VictoriaMetrics metric server (InfluxDB over HTTP)
      ansible.builtin.command:
        argv:
          - proxmox-backup-debug
          - api
          - create
          - /config/metrics/influxdb-http
          - --name
          - "{{ observability_metric_server_name }}"
          - --url
          - "{{ pbs_metric_server_url }}"
          - --organization
          - "{{ observability_influx_organization }}"
          - --bucket
          - "{{ observability_influx_bucket }}"
      when: pbs_metric_server_current | length == 0
      tags: [observability]

    - name: Reconcile the VictoriaMetrics metric server if it drifted
      ansible.builtin.command:
        argv:
          - proxmox-backup-debug
          - api
          - set
          - /config/metrics/influxdb-http/{{ observability_metric_server_name }}
          - --url
          - "{{ pbs_metric_server_url }}"
          - --organization
          - "{{ observability_influx_organization }}"
          - --bucket
          - "{{ observability_influx_bucket }}"
          - --enable
          - "true"
      when:
        - pbs_metric_server_current | length > 0
        - >-
          pbs_metric_server_current.url | default('') != pbs_metric_server_url
          or pbs_metric_server_current.organization | default('proxmox') != observability_influx_organization
          or pbs_metric_server_current.bucket | default('proxmox') != observability_influx_bucket
          or not (pbs_metric_server_current.enable | default(true) | bool)
      tags: [observability]

    # PBS pushes host and datastore usage itself, but not task results or the age
    # of the last good backup of each guest. scripts/files/pbs-health.py reports
    # those from the local PBS API (proxmox-backup-debug, standard library
    # python3 only) every 5 minutes. The script and the units are files on the
    # host, not an inline command. See README.md#backup-and-task-health.
    - name: Create the health collector directory
      ansible.builtin.file:
        path: /usr/local/lib/pbs-health
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [observability, health]

    - name: Install the health collector script
      ansible.builtin.copy:
        src: pbs-health.py
        dest: /usr/local/lib/pbs-health/pbs-health.py
        owner: root
        group: root
        mode: "0755"
      register: pbs_health_script
      tags: [observability, health]

    - name: Install the health collector service
      ansible.builtin.template:
        src: pbs-health.service.j2
        dest: /etc/systemd/system/pbs-health.service
        owner: root
        group: root
        mode: "0644"
      register: pbs_health_service
      tags: [observability, health]

    - name: Install the health collector timer
      ansible.builtin.copy:
        src: pbs-health.timer
        dest: /etc/systemd/system/pbs-health.timer
        owner: root
        group: root
        mode: "0644"
      register: pbs_health_timer
      tags: [observability, health]

    - name: Reload systemd units after a health collector unit change
      ansible.builtin.systemd:
        daemon_reload: yes
      when: pbs_health_service.changed or pbs_health_timer.changed
      tags: [observability, health]

    - name: Ensure the health collector timer is enabled and running
      ansible.builtin.systemd:
        name: pbs-health.timer
        enabled: yes
        state: started
      tags: [observability, health]

    # Push once now, so the series exist without waiting for the first timer
    # run and a script or unit that does not work fails the deploy.
    - name: Run the health collector once after a change
      ansible.builtin.systemd:
        name: pbs-health.service
        state: started
      when: pbs_health_script.changed or pbs_health_service.changed
      tags: [observability, health]

    - name: Allow SSH in UFW
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        comment: SSH

    - name: Open PBS web UI port in UFW
      ufw:
        rule: allow
        port: "8007"
        proto: tcp
        comment: Proxmox Backup Server web UI

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny
