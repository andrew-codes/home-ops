---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: default
spec:
  dependsOn:
    - name: sealed-secrets
    - name: secrets
    - name: metrics
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/grafana
  prune: true
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logs
  namespace: default
spec:
  dependsOn:
    - name: nfs-provisioner
    - name: metrics
    - name: vm-operator
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/logs
  prune: true
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics
  namespace: default
spec:
  dependsOn:
    - name: nfs-provisioner
    - name: vm-operator
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/metrics
  prune: true
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: exporters
  namespace: default
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/exporters
  prune: true
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerting
  namespace: default
spec:
  dependsOn:
    - name: metrics
    - name: vm-operator
    - name: sealed-secrets
    - name: secrets
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/alerting
  prune: true
  wait: true
  timeout: 5m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mqtt
  namespace: default
spec:
  dependsOn:
    - name: nfs-provisioner
    - name: sealed-secrets
    - name: secrets
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: default
  path: ./deployments/staging/mqtt
  prune: true
  wait: true
  timeout: 5m0s
