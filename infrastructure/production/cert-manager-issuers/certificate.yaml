# Wildcard certificate for the home services that move to the tailnet gateway
# (infrastructure/production/gateway). Traefik serves it as its default TLS
# store certificate and reloads it on renewal.
#
# A wildcard keeps the individual hostnames out of Certificate Transparency
# logs. It does not cover smith-simms.family itself or the two-level names
# under home.smith-simms.family, and nothing here needs those.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smith-simms-family-wildcard
  namespace: gateway
spec:
  secretName: smith-simms-family-wildcard-tls
  dnsNames:
    - "*.smith-simms.family"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    # The staging/production switch. Production certificates are trusted by
    # browsers. Staging proved the token and DNS-01 flow without spending
    # Let's Encrypt production rate limits. To test changes to the flow, point
    # this back at letsencrypt-staging; cert-manager re-issues into the same
    # Secret whenever the issuer changes.
    name: letsencrypt-production
