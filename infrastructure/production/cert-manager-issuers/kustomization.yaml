# cloudflare-dns item exists in 1Password, see
# tools/nx-secrets-generators/src/generators/secrets-seal.ts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cluster-issuers.yaml
  - certificate.yaml
