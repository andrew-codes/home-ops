# The seal generator appends tailscale-operator-oauth-sealed.yaml to this list
# when the tailscale-operator-oauth item exists in 1Password, see
# tools/nx-secrets-generators/src/generators/secrets-seal.ts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/tailscale-operator
  - tailscale-operator-oauth-sealed.yaml
