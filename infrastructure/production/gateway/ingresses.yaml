# One Ingress per home service. The backends are in the default namespace, so the
# Ingresses are too: a Traefik Ingress can only route to Services in its own
# namespace. TLS uses the default store certificate (the wildcard), so no
# spec.tls is set. Nothing resolves these names to the gateway yet, so they are
# inert until pihole points them at the home-gateway tailnet address.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ha-gateway
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: ha.smith-simms.family
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
