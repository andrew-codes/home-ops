---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: default
spec:
  interval: 10m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: 1.21.3
---
# cert-manager renews the Telepresence agent-injector webhook certificate. It
# lives in its own Flux Kustomization so its CRDs exist before the traffic-manager
# chart renders Certificate and Issuer resources.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: default
  values:
    crds:
      enabled: true
      keep: true
