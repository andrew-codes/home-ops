---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: default
spec:
  interval: 10m
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: 1.21.3
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
# cert-manager renews the Telepresence agent-injector webhook certificate. It
# lives in its own Flux Kustomization so its CRDs exist before the traffic-manager
# chart renders Certificate and Issuer resources.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: default
  values:
    crds:
      enabled: true
      keep: true
    # The DNS-01 self-check looks the challenge TXT record up through these
    # resolvers only, instead of the node resolver. Pi-hole overrides the
    # smith-simms.family names that move to the tailnet gateway, so a check
    # that went through it would see a different view than Let's Encrypt does.
    extraArgs:
      - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
      - --dns01-recursive-nameservers-only
