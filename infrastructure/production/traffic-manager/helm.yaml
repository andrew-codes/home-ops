---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: telepresence-oss
  namespace: default
spec:
  interval: 10m
  url: oci://ghcr.io/telepresenceio/telepresence-oss
  ref:
    semver: ">=2.0.0 <3.0.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traffic-manager
  namespace: ambassador
spec:
  interval: 5m
  chart:
    spec:
      chart: telepresence-oss
      version: 2.33.3
      sourceRef:
        kind: OCIRepository
        name: telepresence-oss
        namespace: default
  values:
    trafficManager:
      enabled: true
    agentInjector:
      certificate:
        # The default (helm) method generates a 365 day certificate once and then
        # reuses the existing Secret on every upgrade, so it silently expires.
        # cert-manager issues a 90 day certificate and renews it on its own. The
        # chart creates the self-signed Issuer and Certificate and injects the CA
        # into the MutatingWebhookConfiguration.
        method: certmanager
